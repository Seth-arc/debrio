  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading Debrio — workshop and simulation delivery...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a12e349b-4685-40dd-a204-9981dfdf07b4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#E8EAE7;-webkit-font-smoothing:antialiased}\na{color:#2E5B52}a:hover{color:#1E2427}\n.lp a:focus-visible,.lp button:focus-visible{outline:2px solid #5B8279;outline-offset:3px}\n.lp-dark a:focus-visible{outline-color:#8FB2A8}\n/* Hero scene: four breakout rooms glide together, each closes into one quarter of the Debrio square; the dot lands; they part again. One orchestrated loop. */\n.lp-hero{position:relative;max-width:1200px;margin:0 auto;padding:72px clamp(20px,4vw,40px) 0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(24px,4vw,56px);align-items:center}\n.hs{position:relative;width:100%;max-width:520px;aspect-ratio:1/1;margin-left:auto;pointer-events:none}\n.hs-mark{position:absolute;left:25%;top:25%;width:50%;height:50%}\n.rm{position:absolute;width:50%;height:50%;opacity:0}\n.r1{left:0;top:0;--ox:-76%;--oy:-52%;--s:.84}\n.r2{left:50%;top:0;--ox:80%;--oy:-70%;--s:.76}\n.r3{left:0;top:50%;--ox:-90%;--oy:64%;--s:.78}\n.r4{left:50%;top:50%;--ox:72%;--oy:78%;--s:.88}\n.tl{position:absolute;width:50%;height:50%;overflow:hidden;border-radius:16%;background:#20282B;box-shadow:inset 0 0 0 1px #2B3437;transform:translate(var(--tx),var(--ty)) scale(.86)}\n.tl1{left:0;top:0;--tx:-10%;--ty:-10%}.tl2{left:50%;top:0;--tx:10%;--ty:-10%}.tl3{left:0;top:50%;--tx:-10%;--ty:10%}.tl4{left:50%;top:50%;--tx:10%;--ty:10%}\n.tl i{position:absolute;inset:0;display:block}\n.tl i::before{content:\"\";position:absolute;left:35%;top:24%;width:30%;height:30%;border-radius:50%;background:#33403E}\n.tl i::after{content:\"\";position:absolute;left:20%;top:62%;width:60%;height:56%;border-radius:50% 50% 0 0;background:#33403E}\n.ring{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--dot);opacity:0}\n.hs-body{position:absolute;inset:0;border-radius:31.8% 31.8% 31.8% 9%;background:#D3D9D9}\n.hs-dot{position:absolute;left:45.5%;top:45.5%;width:31.8%;height:31.8%;border-radius:50%;background:var(--dot)}\n@media (prefers-reduced-motion:no-preference){\n.hs:not(.still) .hs-mark{animation:hs-clip 12s cubic-bezier(.65,0,.35,1) infinite}\n.hs:not(.still) .rm{animation:hs-room 12s cubic-bezier(.65,0,.35,1) infinite}\n.hs:not(.still) .tl{animation:hs-tile 12s cubic-bezier(.65,0,.35,1) infinite}\n.hs:not(.still) .tl i{animation:hs-face 12s ease infinite}\n.hs:not(.still) .hs-body{animation:hs-body 12s ease infinite}\n.hs:not(.still) .hs-dot{animation:hs-dot 12s cubic-bezier(.3,1.4,.5,1) infinite}\n.hs:not(.still) .ring{animation:hs-speak 12s ease infinite}\n.hs:not(.still) .r3 .ring{animation-delay:1.1s}\n.hs:not(.still) .r2 .ring{animation-delay:2.2s}\n}\n@keyframes hs-room{0%,28%{opacity:1;transform:translate(var(--ox),var(--oy)) scale(var(--s))}46%,49%{opacity:1;transform:none}50%,84%{opacity:0;transform:none}84.5%{opacity:1;transform:none}100%{opacity:1;transform:translate(var(--ox),var(--oy)) scale(var(--s))}}\n@keyframes hs-tile{0%,36%{transform:translate(var(--tx),var(--ty)) scale(.86);border-radius:16%;background:#20282B;box-shadow:inset 0 0 0 1px #2B3437}48%,89%{transform:none;border-radius:3%;background:#D3D9D9;box-shadow:inset 0 0 0 1px #D3D9D9}100%{transform:translate(var(--tx),var(--ty)) scale(.86);border-radius:16%;background:#20282B;box-shadow:inset 0 0 0 1px #2B3437}}\n@keyframes hs-face{0%,34%{opacity:1}43%,93%{opacity:0}100%{opacity:1}}\n@keyframes hs-body{0%,45%{opacity:0}48%,85%{opacity:1}87.5%,100%{opacity:0}}\n@keyframes hs-clip{0%,40%{clip-path:inset(-150% round 0%)}46%,86%{clip-path:inset(0% round 31.8% 31.8% 31.8% 9%)}93%,100%{clip-path:inset(-150% round 0%)}}\n@keyframes hs-speak{0%,2%{opacity:0}4%,12%{opacity:1}14%,100%{opacity:0}}\n@keyframes hs-dot{0%,53%{transform:scale(0)}61%,80%{transform:scale(1)}84%,100%{transform:scale(0)}}\n\n/* Phone */\n@media (max-width:860px){\n.lp-nav-links{display:none!important}\n.lp-two{grid-template-columns:minmax(0,1fr)!important}\n.lp-three{grid-template-columns:minmax(0,1fr)!important}\n.lp-stats{grid-template-columns:minmax(0,1fr)!important}\n.lp-hero{grid-template-columns:minmax(0,1fr)!important;padding-top:40px!important}\n.hs{max-width:340px;margin:0 auto}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"lp\" style=\"font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif; color: #1E2427; background: #E8EAE7; --dot: {{accent}}\" data-canvas-width=\"1440\" data-canvas-height=\"5200\">\n\n<header class=\"lp-dark\" style=\"position: relative; overflow: hidden; background: #131719; color: #D3D9D9; padding-bottom: 280px\">\n<nav aria-label=\"Main\" style=\"position: relative; max-width: 1200px; margin: 0 auto; padding: 22px clamp(20px, 4vw, 40px); display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; color: #D3D9D9; text-decoration: none; font-size: 20px; font-weight: 650; letter-spacing: -0.04em\"><span aria-hidden=\"true\" style=\"position: relative; display: inline-block; width: 26px; height: 26px; border-radius: 8px 8px 8px 2px; background: #D3D9D9; flex-shrink: 0\"><span style=\"position: absolute; left: 11.8px; top: 11.8px; width: 8.3px; height: 8.3px; border-radius: 50%; background: var(--dot)\"><\u002Fspan><\u002Fspan>debrio<\u002Fa>\n<div class=\"lp-nav-links\" style=\"display: flex; align-items: center; gap: 28px; font-size: 14px\">\n<a href=\"#how\" style=\"color: #AEB7B8; text-decoration: none\">How it works<\u002Fa>\n<a href=\"#simulations\" style=\"color: #AEB7B8; text-decoration: none\">Simulations<\u002Fa>\n<a href=\"#accessibility\" style=\"color: #AEB7B8; text-decoration: none\">Accessibility<\u002Fa>\n<\u002Fdiv>\n<a href=\"#demo\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: #2E4A44; color: #DCE7E3; text-decoration: none; font-size: 14px; font-weight: 600\">Book a demo<\u002Fa>\n<\u002Fnav>\n\n<div class=\"lp-hero\">\n<div id=\"top\" style=\"display: flex; flex-direction: column; gap: 24px\">\n<h1 style=\"margin: 0; max-width: 12ch; font-size: clamp(44px, 6vw, 84px); line-height: 1.0; font-weight: 700; letter-spacing: -0.045em; color: #E4E9E9\">Every group, back in one room.<\u002Fh1>\n<p style=\"margin: 0; max-width: 46ch; font-size: clamp(17px, 1.4vw, 19px); line-height: 1.6; color: #A3AEB0\">Debrio runs facilitated workshops and decision simulations. Breakout rooms, timed activities, questions and evidence live in one session, so you can teach instead of juggling tools.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px\">\n<a href=\"#demo\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 10px; background: #D3D9D9; color: #131719; text-decoration: none; font-size: 15px; font-weight: 600\">Book a demo<\u002Fa>\n<a href=\"#how\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 10px; border: 1px solid #323B3E; color: #D3D9D9; text-decoration: none; font-size: 15px; font-weight: 600\">See how a session runs<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"hs {{fieldClass}}\" aria-hidden=\"true\">\n<div class=\"hs-mark\">\n<div class=\"rm r1\"><span class=\"tl tl1\"><i><\u002Fi><\u002Fspan><span class=\"tl tl2\"><i><\u002Fi><b class=\"ring\"><\u002Fb><\u002Fspan><span class=\"tl tl3\"><i><\u002Fi><\u002Fspan><span class=\"tl tl4\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"rm r2\"><span class=\"tl tl1\"><i><\u002Fi><\u002Fspan><span class=\"tl tl2\"><i><\u002Fi><\u002Fspan><span class=\"tl tl3\"><i><\u002Fi><b class=\"ring\"><\u002Fb><\u002Fspan><span class=\"tl tl4\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"rm r3\"><span class=\"tl tl1\"><i><\u002Fi><b class=\"ring\"><\u002Fb><\u002Fspan><span class=\"tl tl2\"><i><\u002Fi><\u002Fspan><span class=\"tl tl3\"><i><\u002Fi><\u002Fspan><span class=\"tl tl4\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"rm r4\"><span class=\"tl tl1\"><i><\u002Fi><\u002Fspan><span class=\"tl tl2\"><i><\u002Fi><\u002Fspan><span class=\"tl tl3\"><i><\u002Fi><\u002Fspan><span class=\"tl tl4\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<span class=\"hs-body\"><\u002Fspan>\n<span class=\"hs-dot\"><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section aria-label=\"The facilitator's console\" style=\"max-width: 1200px; margin: -250px auto 0; padding: 0 clamp(20px, 4vw, 40px); position: relative\">\n<img src=\"d9987ab4-7fa9-41ca-b5b8-4dcbf48d91f2\" alt=\"Debrio facilitator view: four breakout rooms on one screen, each showing its participants, progress and listen, speak, message and join controls, with the activity timer and session steps alongside.\" style=\"display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid #2B3437; background: #131719\">\n<\u002Fsection>\n\n<section id=\"how\" aria-labelledby=\"how-title\" style=\"max-width: 1200px; margin: 0 auto; padding: 120px clamp(20px, 4vw, 40px) 40px; display: flex; flex-direction: column; gap: 48px\">\n<h2 id=\"how-title\" style=\"margin: 0; max-width: 20ch; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; font-weight: 650; letter-spacing: -0.03em\">Build it once. Run it live. Keep what was learned.<\u002Fh2>\n<ol class=\"lp-three\" style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px\">\n<li style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #BEC4C0\">\n<span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #2F5A52; color: #EEF3F1; font-size: 13px; font-weight: 600\">1<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.015em\">Build<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3E474A\">Design the session as steps: the prompt, the timing, the output you expect and the materials each group receives.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #BEC4C0\">\n<span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #2F5A52; color: #EEF3F1; font-size: 13px; font-weight: 600\">2<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.015em\">Run<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3E474A\">Let people in from the lobby, open breakouts, watch every room at once and move everyone to the next step together.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #BEC4C0\">\n<span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #2F5A52; color: #EEF3F1; font-size: 13px; font-weight: 600\">3<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.015em\">Review<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3E474A\">Compare first and revised attempts, choose the evidence for your debrief and export a record of what each group produced.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<section class=\"lp-dark\" aria-labelledby=\"console-title\" style=\"background: #131719; color: #D3D9D9; margin-top: 80px\">\n<div class=\"lp-two\" style=\"max-width: 1200px; margin: 0 auto; padding: 112px clamp(20px, 4vw, 40px); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(40px, 5vw, 72px); align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 36px\">\n<h2 id=\"console-title\" style=\"margin: 0; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; font-weight: 650; letter-spacing: -0.03em; color: #E4E9E9\">A facilitator's console, not a video call with extras.<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 26px\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #232A2D; color: #8FB2A8\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><\u002Fsvg><\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 16px; font-weight: 600; color: #D3D9D9\">Every room at a glance<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #96A1A3\">See who is in each breakout, how far they have got and who needs you. Listen, speak, message or join in one click.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #232A2D; color: #8FB2A8\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 12V5a2 2 0 0 1 4 0v7-8a2 2 0 0 1 4 0v8-5a2 2 0 0 1 4 0v9a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-4-6a2 2 0 0 1 3-2l1 1Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 16px; font-weight: 600; color: #D3D9D9\">Questions that don't get lost<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #96A1A3\">Requests for information stay pinned above the chat until you acknowledge or answer them.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #232A2D; color: #8FB2A8\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"18\" rx=\"3\"><\u002Frect><path d=\"M8 2v4m8-4v4M8 11h8m-8 5h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 16px; font-weight: 600; color: #D3D9D9\">Steps that move the whole session<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #96A1A3\">One timer, one prompt, one required output. Advance when you are ready; work in progress stays saved.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #232A2D; color: #8FB2A8\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0\"><\u002Fpath><path d=\"M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 16px; font-weight: 600; color: #D3D9D9\">A lobby you control<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #96A1A3\">Participants check their microphone and camera, then wait until you let them in.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<img src=\"25cdb9d8-6f6e-43fa-b2db-d837576892f4\" alt=\"Debrio messages panel: room chips across the top, a pinned request from the Baobab group with acknowledge and reply buttons, and a chat thread below.\" style=\"display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid #2B3437\">\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"simulations\" aria-labelledby=\"sim-title\" style=\"max-width: 1200px; margin: 0 auto; padding: 120px clamp(20px, 4vw, 40px)\">\n<div class=\"lp-two\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(40px, 5vw, 72px); align-items: center\">\n<img src=\"5139f6f8-6c25-443c-9f62-76b78c27e774\" alt=\"Debrio simulation in progress: the Financing Assurances scenario on the shared screen with its phase stepper, and the White Cell desk listing a released inject and a team's proposed action awaiting review.\" style=\"display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid #D2D6D2\">\n<div style=\"display: flex; flex-direction: column; gap: 22px\">\n<h2 id=\"sim-title\" style=\"margin: 0; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; font-weight: 650; letter-spacing: -0.03em\">Decision simulations with a White Cell.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #3E474A\">Give each team its own mandate and private brief. Release new information mid-exercise, take proposed actions for review, and publish outcomes you have decided. The software never invents a result.<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px\">\n<li style=\"display: flex; gap: 10px; align-items: center; font-size: 15px; color: #3E474A\"><span style=\"display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #E1E4E0; color: #2E5B52; flex-shrink: 0\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan>Private briefs for each team<\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: center; font-size: 15px; color: #3E474A\"><span style=\"display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #E1E4E0; color: #2E5B52; flex-shrink: 0\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan>Injects released to the teams you choose<\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: center; font-size: 15px; color: #3E474A\"><span style=\"display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #E1E4E0; color: #2E5B52; flex-shrink: 0\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan>Every outcome reviewed by a person<\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: center; font-size: 15px; color: #3E474A\"><span style=\"display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #E1E4E0; color: #2E5B52; flex-shrink: 0\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan>A turn-by-turn record for the debrief<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"accessibility\" aria-labelledby=\"a11y-title\" style=\"background: #F3F4F2; border-top: 1px solid #D2D6D2; border-bottom: 1px solid #D2D6D2\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 104px clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 640px\">\n<h2 id=\"a11y-title\" style=\"margin: 0; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; font-weight: 650; letter-spacing: -0.03em\">Built for everyone in the room.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #3E474A\">Every screen is tested against WCAG 2.2 AA, works with a keyboard alone, and follows each person's light, dark and reduced-motion settings.<\u002Fp>\n<\u002Fdiv>\n<dl class=\"lp-stats\" style=\"margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px\">\n<div style=\"display: flex; flex-direction: column-reverse; gap: 8px; padding-top: 18px; border-top: 1px solid #BEC4C0\">\n<dt style=\"font-size: 15px; line-height: 1.5; color: #535C5F\">accessibility violations across 98 audited screen states<\u002Fdt>\n<dd style=\"margin: 0; font-size: 44px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums\">0<\u002Fdd>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column-reverse; gap: 8px; padding-top: 18px; border-top: 1px solid #BEC4C0\">\n<dt style=\"font-size: 15px; line-height: 1.5; color: #535C5F\">Lighthouse accessibility score<\u002Fdt>\n<dd style=\"margin: 0; font-size: 44px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums\">100<\u002Fdd>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column-reverse; gap: 8px; padding-top: 18px; border-top: 1px solid #BEC4C0\">\n<dt style=\"font-size: 15px; line-height: 1.5; color: #535C5F\">width where every screen still fits without sideways scrolling<\u002Fdt>\n<dd style=\"margin: 0; font-size: 44px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums\">320px<\u002Fdd>\n<\u002Fdiv>\n<\u002Fdl>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"demo\" class=\"lp-dark\" aria-labelledby=\"demo-title\" style=\"background: #131719; color: #D3D9D9\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 120px clamp(20px, 4vw, 40px); display: flex; flex-direction: column; align-items: flex-start; gap: 28px\">\n<span aria-hidden=\"true\" style=\"position: relative; display: inline-block; width: 52px; height: 52px; border-radius: 17px 17px 17px 5px; background: #D3D9D9; flex-shrink: 0\"><span style=\"position: absolute; left: 23.7px; top: 23.7px; width: 16.6px; height: 16.6px; border-radius: 50%; background: var(--dot)\"><\u002Fspan><\u002Fspan>\n<h2 id=\"demo-title\" style=\"margin: 0; max-width: 16ch; font-size: clamp(34px, 4.2vw, 60px); line-height: 1.05; font-weight: 700; letter-spacing: -0.04em; color: #E4E9E9\">Run your next session on Debrio.<\u002Fh2>\n<p style=\"margin: 0; max-width: 52ch; font-size: 17px; line-height: 1.6; color: #A3AEB0\">We will walk you through a live workshop and a simulation, using a scenario from your own programme.<\u002Fp>\n<a href=\"mailto:[YOUR EMAIL]?subject=Debrio%20demo\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 10px; background: #D3D9D9; color: #131719; text-decoration: none; font-size: 15px; font-weight: 600\">Book a demo<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #131719; color: #879294; border-top: 1px solid #242B2E\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 28px clamp(20px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; font-size: 14px\">\n<span style=\"display: flex; align-items: center; gap: 10px; color: #D3D9D9; font-weight: 650; letter-spacing: -0.04em; font-size: 16px\"><span aria-hidden=\"true\" style=\"position: relative; display: inline-block; width: 20px; height: 20px; border-radius: 6px 6px 6px 2px; background: #D3D9D9; flex-shrink: 0\"><span style=\"position: absolute; left: 9.1px; top: 9.1px; width: 6.4px; height: 6.4px; border-radius: 50%; background: var(--dot)\"><\u002Fspan><\u002Fspan>debrio<\u002Fspan>\n<span>© 2026 Debrio<\u002Fspan>\n<div style=\"display: flex; gap: 20px\">\n<a href=\"#accessibility\" style=\"color: #AEB7B8\">Accessibility<\u002Fa>\n<a href=\"[YOUR PRIVACY URL]\" style=\"color: #AEB7B8\">Privacy<\u002Fa>\n<a href=\"mailto:[YOUR EMAIL]\" style=\"color: #AEB7B8\">Contact<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div class=\"lp\" style=\"font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif; color: #1E2427; background: #E8EAE7; --dot: #6E9E92\" data-canvas-width=\"1440\" data-canvas-height=\"5200\" data-document-role=\"page\" data-label=\"Landing page\">\n\n<header class=\"lp-dark\" style=\"position: relative; overflow: hidden; background: #131719; color: #D3D9D9; padding-bottom: 280px\">\n<nav aria-label=\"Main\" style=\"position: relative; max-width: 1200px; margin: 0 auto; padding: 22px clamp(20px, 4vw, 40px); display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; color: #D3D9D9; text-decoration: none; font-size: 20px; font-weight: 650; letter-spacing: -0.04em\"><span aria-hidden=\"true\" style=\"position: relative; display: inline-block; width: 26px; height: 26px; border-radius: 8px 8px 8px 2px; background: #D3D9D9; flex-shrink: 0\"><span style=\"position: absolute; left: 11.8px; top: 11.8px; width: 8.3px; height: 8.3px; border-radius: 50%; background: var(--dot)\"><\u002Fspan><\u002Fspan>debrio<\u002Fa>\n<div class=\"lp-nav-links\" style=\"display: flex; align-items: center; gap: 28px; font-size: 14px\">\n<a href=\"#how\" style=\"color: #AEB7B8; text-decoration: none\">How it works<\u002Fa>\n<a href=\"#simulations\" style=\"color: #AEB7B8; text-decoration: none\">Simulations<\u002Fa>\n<a href=\"#accessibility\" style=\"color: #AEB7B8; text-decoration: none\">Accessibility<\u002Fa>\n<\u002Fdiv>\n<a href=\"#demo\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: #2E4A44; color: #DCE7E3; text-decoration: none; font-size: 14px; font-weight: 600\">Book a demo<\u002Fa>\n<\u002Fnav>\n\n<div class=\"lp-hero\">\n<div id=\"top\" style=\"display: flex; flex-direction: column; gap: 24px\">\n<h1 style=\"margin: 0; max-width: 12ch; font-size: clamp(44px, 6vw, 84px); line-height: 1.0; font-weight: 700; letter-spacing: -0.045em; color: #E4E9E9\">Every group, back in one room.<\u002Fh1>\n<p style=\"margin: 0; max-width: 46ch; font-size: clamp(17px, 1.4vw, 19px); line-height: 1.6; color: #A3AEB0\">Debrio runs facilitated workshops and decision simulations. Breakout rooms, timed activities, questions and evidence live in one session, so you can teach instead of juggling tools.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px\">\n<a href=\"#demo\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 10px; background: #D3D9D9; color: #131719; text-decoration: none; font-size: 15px; font-weight: 600\">Book a demo<\u002Fa>\n<a href=\"#how\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 10px; border: 1px solid #323B3E; color: #D3D9D9; text-decoration: none; font-size: 15px; font-weight: 600\">See how a session runs<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"hs \" aria-hidden=\"true\">\n<div class=\"hs-mark\">\n<div class=\"rm r1\"><span class=\"tl tl1\"><i><\u002Fi><\u002Fspan><span class=\"tl tl2\"><i><\u002Fi><b class=\"ring\"><\u002Fb><\u002Fspan><span class=\"tl tl3\"><i><\u002Fi><\u002Fspan><span class=\"tl tl4\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"rm r2\"><span class=\"tl tl1\"><i><\u002Fi><\u002Fspan><span class=\"tl tl2\"><i><\u002Fi><\u002Fspan><span class=\"tl tl3\"><i><\u002Fi><b class=\"ring\"><\u002Fb><\u002Fspan><span class=\"tl tl4\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"rm r3\"><span class=\"tl tl1\"><i><\u002Fi><b class=\"ring\"><\u002Fb><\u002Fspan><span class=\"tl tl2\"><i><\u002Fi><\u002Fspan><span class=\"tl tl3\"><i><\u002Fi><\u002Fspan><span class=\"tl tl4\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"rm r4\"><span class=\"tl tl1\"><i><\u002Fi><\u002Fspan><span class=\"tl tl2\"><i><\u002Fi><\u002Fspan><span class=\"tl tl3\"><i><\u002Fi><\u002Fspan><span class=\"tl tl4\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<span class=\"hs-body\"><\u002Fspan>\n<span class=\"hs-dot\"><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section aria-label=\"The facilitator's console\" style=\"max-width: 1200px; margin: -250px auto 0; padding: 0 clamp(20px, 4vw, 40px); position: relative\">\n<img src=\"d9987ab4-7fa9-41ca-b5b8-4dcbf48d91f2\" alt=\"Debrio facilitator view: four breakout rooms on one screen, each showing its participants, progress and listen, speak, message and join controls, with the activity timer and session steps alongside.\" style=\"display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid #2B3437; background: #131719\">\n<\u002Fsection>\n\n<section id=\"how\" aria-labelledby=\"how-title\" style=\"max-width: 1200px; margin: 0 auto; padding: 120px clamp(20px, 4vw, 40px) 40px; display: flex; flex-direction: column; gap: 48px\">\n<h2 id=\"how-title\" style=\"margin: 0; max-width: 20ch; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; font-weight: 650; letter-spacing: -0.03em\">Build it once. Run it live. Keep what was learned.<\u002Fh2>\n<ol class=\"lp-three\" style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px\">\n<li style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #BEC4C0\">\n<span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #2F5A52; color: #EEF3F1; font-size: 13px; font-weight: 600\">1<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.015em\">Build<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3E474A\">Design the session as steps: the prompt, the timing, the output you expect and the materials each group receives.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #BEC4C0\">\n<span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #2F5A52; color: #EEF3F1; font-size: 13px; font-weight: 600\">2<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.015em\">Run<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3E474A\">Let people in from the lobby, open breakouts, watch every room at once and move everyone to the next step together.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #BEC4C0\">\n<span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #2F5A52; color: #EEF3F1; font-size: 13px; font-weight: 600\">3<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.015em\">Review<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3E474A\">Compare first and revised attempts, choose the evidence for your debrief and export a record of what each group produced.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<section class=\"lp-dark\" aria-labelledby=\"console-title\" style=\"background: #131719; color: #D3D9D9; margin-top: 80px\">\n<div class=\"lp-two\" style=\"max-width: 1200px; margin: 0 auto; padding: 112px clamp(20px, 4vw, 40px); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(40px, 5vw, 72px); align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 36px\">\n<h2 id=\"console-title\" style=\"margin: 0; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; font-weight: 650; letter-spacing: -0.03em; color: #E4E9E9\">A facilitator's console, not a video call with extras.<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 26px\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #232A2D; color: #8FB2A8\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><\u002Fsvg><\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 16px; font-weight: 600; color: #D3D9D9\">Every room at a glance<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #96A1A3\">See who is in each breakout, how far they have got and who needs you. Listen, speak, message or join in one click.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #232A2D; color: #8FB2A8\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 12V5a2 2 0 0 1 4 0v7-8a2 2 0 0 1 4 0v8-5a2 2 0 0 1 4 0v9a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-4-6a2 2 0 0 1 3-2l1 1Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 16px; font-weight: 600; color: #D3D9D9\">Questions that don't get lost<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #96A1A3\">Requests for information stay pinned above the chat until you acknowledge or answer them.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #232A2D; color: #8FB2A8\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"18\" rx=\"3\"><\u002Frect><path d=\"M8 2v4m8-4v4M8 11h8m-8 5h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 16px; font-weight: 600; color: #D3D9D9\">Steps that move the whole session<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #96A1A3\">One timer, one prompt, one required output. Advance when you are ready; work in progress stays saved.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #232A2D; color: #8FB2A8\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0\"><\u002Fpath><path d=\"M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 16px; font-weight: 600; color: #D3D9D9\">A lobby you control<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #96A1A3\">Participants check their microphone and camera, then wait until you let them in.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<img src=\"25cdb9d8-6f6e-43fa-b2db-d837576892f4\" alt=\"Debrio messages panel: room chips across the top, a pinned request from the Baobab group with acknowledge and reply buttons, and a chat thread below.\" style=\"display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid #2B3437\">\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"simulations\" aria-labelledby=\"sim-title\" style=\"max-width: 1200px; margin: 0 auto; padding: 120px clamp(20px, 4vw, 40px)\">\n<div class=\"lp-two\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(40px, 5vw, 72px); align-items: center\">\n<img src=\"5139f6f8-6c25-443c-9f62-76b78c27e774\" alt=\"Debrio simulation in progress: the Financing Assurances scenario on the shared screen with its phase stepper, and the White Cell desk listing a released inject and a team's proposed action awaiting review.\" style=\"display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid #D2D6D2\">\n<div style=\"display: flex; flex-direction: column; gap: 22px\">\n<h2 id=\"sim-title\" style=\"margin: 0; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; font-weight: 650; letter-spacing: -0.03em\">Decision simulations with a White Cell.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #3E474A\">Give each team its own mandate and private brief. Release new information mid-exercise, take proposed actions for review, and publish outcomes you have decided. The software never invents a result.<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px\">\n<li style=\"display: flex; gap: 10px; align-items: center; font-size: 15px; color: #3E474A\"><span style=\"display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #E1E4E0; color: #2E5B52; flex-shrink: 0\"><svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan>Private briefs for each team<\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: center; font-size: 15px; color: #3E474A\"><span style=\"display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #E1E4E0; color: #2E5B52; flex-shrink: 0\"><svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan>Injects released to the teams you choose<\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: center; font-size: 15px; color: #3E474A\"><span style=\"display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #E1E4E0; color: #2E5B52; flex-shrink: 0\"><svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan>Every outcome reviewed by a person<\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: center; font-size: 15px; color: #3E474A\"><span style=\"display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #E1E4E0; color: #2E5B52; flex-shrink: 0\"><svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan>A turn-by-turn record for the debrief<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"accessibility\" aria-labelledby=\"a11y-title\" style=\"background: #F3F4F2; border-top: 1px solid #D2D6D2; border-bottom: 1px solid #D2D6D2\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 104px clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 640px\">\n<h2 id=\"a11y-title\" style=\"margin: 0; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; font-weight: 650; letter-spacing: -0.03em\">Built for everyone in the room.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #3E474A\">Every screen is tested against WCAG 2.2 AA, works with a keyboard alone, and follows each person's light, dark and reduced-motion settings.<\u002Fp>\n<\u002Fdiv>\n<dl class=\"lp-stats\" style=\"margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px\">\n<div style=\"display: flex; flex-direction: column-reverse; gap: 8px; padding-top: 18px; border-top: 1px solid #BEC4C0\">\n<dt style=\"font-size: 15px; line-height: 1.5; color: #535C5F\">accessibility violations across 98 audited screen states<\u002Fdt>\n<dd style=\"margin: 0; font-size: 44px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums\">0<\u002Fdd>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column-reverse; gap: 8px; padding-top: 18px; border-top: 1px solid #BEC4C0\">\n<dt style=\"font-size: 15px; line-height: 1.5; color: #535C5F\">Lighthouse accessibility score<\u002Fdt>\n<dd style=\"margin: 0; font-size: 44px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums\">100<\u002Fdd>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column-reverse; gap: 8px; padding-top: 18px; border-top: 1px solid #BEC4C0\">\n<dt style=\"font-size: 15px; line-height: 1.5; color: #535C5F\">width where every screen still fits without sideways scrolling<\u002Fdt>\n<dd style=\"margin: 0; font-size: 44px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums\">320px<\u002Fdd>\n<\u002Fdiv>\n<\u002Fdl>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"demo\" class=\"lp-dark\" aria-labelledby=\"demo-title\" style=\"background: #131719; color: #D3D9D9\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 120px clamp(20px, 4vw, 40px); display: flex; flex-direction: column; align-items: flex-start; gap: 28px\">\n<span aria-hidden=\"true\" style=\"position: relative; display: inline-block; width: 52px; height: 52px; border-radius: 17px 17px 17px 5px; background: #D3D9D9; flex-shrink: 0\"><span style=\"position: absolute; left: 23.7px; top: 23.7px; width: 16.6px; height: 16.6px; border-radius: 50%; background: var(--dot)\"><\u002Fspan><\u002Fspan>\n<h2 id=\"demo-title\" style=\"margin: 0; max-width: 16ch; font-size: clamp(34px, 4.2vw, 60px); line-height: 1.05; font-weight: 700; letter-spacing: -0.04em; color: #E4E9E9\">Run your next session on Debrio.<\u002Fh2>\n<p style=\"margin: 0; max-width: 52ch; font-size: 17px; line-height: 1.6; col

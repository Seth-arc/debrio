function simResource(kind){let b=briefs[ui.simTeam];modal(`<div class="eyebrow">${kind==='shared'?'SHARED SITUATION BRIEF':'RESTRICTED TEAM BRIEF · '+teamNames[ui.simTeam]}</div><h2 style="margin-top:10px">${kind==='shared'?'Financing Assurances':esc(b.role)}</h2><div class="source-panel">${esc(kind==='shared'?'The Republic of Kavala faces a $750 million Eurobond maturity in six weeks. Creditor assurances remain incomplete. The four teams must negotiate a defensible response while distinguishing indicative statements from authorized commitments.\n\nThis is a fictional learning exercise. White Cell controls events, phase progression, and adjudication.':b.mission+'\n\nPRIVATE WORKING INFORMATION\n'+b.private)}</div><footer><button onclick="closeModal()">Back to meeting</button></footer>`)}
function requestsForView(){return ui.requests.filter(r=>r.mode===ui.mode&&(facilitator()||r.room===currentRoom()))}
function chatPanel(){const host=facilitator(),view=host?(ui.messageRoom||currentRoom()):currentRoom(),list=ui.messages.filter(m=>m.mode===ui.mode&&m.room===view),req=requestsForView(),mine=m=>host?/facilitator|White Cell/.test(m.sender):/^Participant/.test(m.sender);return `${host?`<div class="msg-rooms" role="tablist" aria-label="Conversation">${['main',...roomIds()].map(id=>{let open=ui.requests.filter(r=>r.mode===ui.mode&&r.room===id&&r.status!=='replied').length;return `<button role="tab" aria-selected="${view===id}" class="${view===id?'on':''}" onclick="ui.draftMsg=document.getElementById('roomMessage').value;ui.messageRoom='${id}';render()">${id==='main'?'Main':roomName(id)}${open?'<i class="msg-dot" role="img" aria-label="Open request"></i>':''}</button>`}).join('')}</div>`:''}${req.length?`<div class="msg-requests">${req.map(r=>`<div class="request-card ${r.status}"><div class="req-head">${icon('hand')}<span>${roomName(r.room)}</span>${r.status==='acknowledged'?'<span class="req-state">Seen</span>':r.status==='replied'?'<span class="req-state">Answered</span>':''}${host&&r.status!=='replied'?`<span class="req-actions">${r.status!=='acknowledged'?`<button class="room-icon" aria-label="Acknowledge" onclick="ackRfi(${r.id})">${icon('check')}</button>`:''}<button class="room-icon" aria-label="Reply to room" onclick="replyRfi(${r.id})">${icon('reply')}</button></span>`:''}</div><p>${esc(r.question)}</p>${r.reply?`<p class="req-reply">${esc(r.reply)}</p>`:''}</div>`).join('')}</div>`:''}<div class="msg-thread">${list.map(m=>`<div class="thread-message ${m.broadcast?'broadcast':''} ${mine(m)?'mine':''}"><div class="meta"><span>${esc(mine(m)?'You':m.sender)}</span>${m.broadcast?`<span class="msg-flag" role="img" aria-label="Sent to all rooms">${icon('broadcast')}</span>`:''}</div><p>${esc(m.text)}</p></div>`).join('')||'<div class="msg-empty">No messages yet</div>'}</div><div class="compose-box"><textarea id="roomMessage" rows="2" aria-label="Message text" placeholder="${host?(ui.broadcast?'Message all rooms':'Message '+(view==='main'?'the main room':roomName(view))):'Message your room'}" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendRoomMessage()}">${esc(ui.draftMsg||'')}</textarea><div class="compose-actions">${host?`<button class="room-icon ${ui.broadcast?'on':''}" aria-pressed="${!!ui.broadcast}" aria-label="${ui.broadcast?'Sending to all rooms':'Send to all rooms'}" onclick="ui.draftMsg=document.getElementById('roomMessage').value;ui.broadcast=!ui.broadcast;render()">${icon('broadcast')}</button>`:`<button class="room-icon" aria-label="Request for information" onclick="askRfi()">${icon('hand')}</button>`}<button class="primary compose-send" aria-label="Send message" onclick="sendRoomMessage()">${icon('send')}</button></div></div>`}
function sendTo(target,text,sender){let ids=target==='all'?roomIds():[target];ids.forEach(room=>ui.messages.push({id:Date.now()+Math.random(),mode:ui.mode,room,sender,text,broadcast:target==='all'}));return ids.length}
function sendRoomMessage(){let el=document.getElementById('roomMessage'),text=el.value.trim();if(!text){notify('Write a message before sending');return}let target=facilitator()?(ui.broadcast?'all':(ui.messageRoom||currentRoom())):currentRoom();let n=sendTo(target,text,facilitator()?(isSim()?'White Cell':'Sethu · facilitator'):'Participant · '+roomName(currentRoom()));ui.draftMsg='';if(target!=='all')ui.messageRoom=target;render();notify(n>1?'Sent to all '+(isSim()?'team':'breakout')+' rooms':'Sent to '+roomName(target))}
function messageRoom(target){modal(`<div class="eyebrow">FACILITATOR MESSAGE</div><h2 style="margin-top:10px">${target==='all'?'Message all rooms':'Message '+roomName(target)}</h2><p>${target==='all'?'A copy is delivered to every breakout room conversation.':'Only the selected room receives this instruction.'} Delivery is simulated.</p><label for="targetMessage">Message</label><textarea id="targetMessage" placeholder="Instruction, clarification, or announcement…"></textarea><footer><button onclick="closeModal()">Cancel</button><button class="primary" onclick="sendTargetMessage('${target}')">${target==='all'?'Broadcast to four rooms':'Send to room'}</button></footer>`)}
function sendTargetMessage(target){let text=document.getElementById('targetMessage').value.trim();if(!text){notify('Write a message first');return}sendTo(target,text,isSim()?'White Cell':'Sethu · facilitator');ui.panel='chat';ui.panelOpen=true;ui.messageRoom=target==='all'?'room-0':target;closeModal();render();notify(target==='all'?'Broadcast delivered to all four rooms · demo':'Message sent to '+roomName(target)+' · demo')}
function askRfi(){modal(`<div class="eyebrow">REQUEST FOR INFORMATION · ${roomName(currentRoom())}</div><h2 style="margin-top:10px">What does your room need to know?</h2><p>Send a written question to ${isSim()?'White Cell':'the facilitator'}. Their reply comes back to this room’s conversation.</p><label for="rfiQuestion">Your question</label><textarea id="rfiQuestion" placeholder="Describe the clarification or assistance your group needs…"></textarea><footer><button onclick="closeModal()">Cancel</button><button class="primary" onclick="sendRfi()">Send request</button></footer>`)}
function sendRfi(){let q=document.getElementById('rfiQuestion').value.trim();if(!q){notify('Add a question to your request');return}ui.requests.push({id:Date.now(),mode:ui.mode,room:currentRoom(),question:q,status:'submitted',reply:''});ui.panel='chat';ui.panelOpen=true;closeModal();render();notify('Request sent · awaiting facilitator response in this demo')}
function ackRfi(id){let r=ui.requests.find(x=>x.id===id);r.status='acknowledged';render();notify('Request acknowledged · '+roomName(r.room))}
function replyRfi(id){let r=ui.requests.find(x=>x.id===id);modal(`<div class="eyebrow">REPLY TO ${roomName(r.room)}</div><h2 style="margin-top:10px">Request for information</h2><div class="source-panel">${esc(r.question)}</div><label for="rfiReply">Reply to this room</label><textarea id="rfiReply" placeholder="Provide a clarification or next step…"></textarea><footer><button onclick="closeModal()">Cancel</button><button class="primary" onclick="sendRfiReply(${id})">Send reply</button></footer>`)}
function sendRfiReply(id){let r=ui.requests.find(x=>x.id===id),text=document.getElementById('rfiReply').value.trim();if(!text){notify('Write a reply first');return}r.reply=text;r.status='replied';sendTo(r.room,text,isSim()?'White Cell':'Sethu · facilitator');ui.messageRoom=r.room;closeModal();render();notify('Reply delivered to '+roomName(r.room)+' · demo')}
function activePolls(){return ui.polls.filter(p=>p.mode===ui.mode&&(facilitator()||p.rooms.includes(currentRoom())))}
function pollPanel(){let list=activePolls();return `${facilitator()?`<button class="primary btnblock" style="margin:0 0 16px" onclick="createPoll()">+ Create poll</button><p class="panel-heading-note">Run a main-room poll, target one breakout, or send the same question to all rooms.</p>`:`<p class="panel-heading-note">Polls for ${roomName(currentRoom())}. One vote per sample participant per room.</p>`}${list.map(p=>pollCard(p)).join('')||'<div class="empty-state">No polls for this room yet.<br>Your facilitator opens voting here.</div>'}<p class="form-help" style="margin-top:16px">Local demo ballots only. Responses are not a measure of learning unless the assessment is designed for that purpose.</p>`}
function pollCard(p){let room=facilitator()?(ui.pollRoom?.[p.id]||p.rooms[0]):currentRoom(),ballots=Object.values(p.votes[room]||{}),total=ballots.length,mine=facilitator()?undefined:(p.votes[room]||{})[voterKey()],counts=p.options.map((o,i)=>ballots.filter(x=>x===i).length);return `<article class="poll-card"><div class="row between"><span class="pill ${p.open?'':'amber'}">${p.open?'Voting open':'Voting closed'}</span><span class="votes">${total} response${total===1?'':'s'}</span></div><h3>${esc(p.question)}</h3><div class="note" style="margin:6px 0 12px">${p.rooms.length===4?'All breakout rooms · ':''}${roomName(room)} · ${p.revealed?'Results revealed':'Results hidden'}</div>${facilitator()&&p.rooms.length>1?`<label class="mini-label" for="pollRoom${p.id}">ROOM RESULTS</label><select id="pollRoom${p.id}" style="font-size:11px;margin:6px 0 10px" onchange="selectPollRoom(${p.id},this.value)">${p.rooms.map(r=>`<option value="${r}" ${r===room?'selected':''}>${roomName(r)}</option>`).join('')}</select>`:''}${p.options.map((o,i)=>`<button class="option ${mine===i?'chosen':''}" ${facilitator()||!p.open?'disabled':''} onclick="castVote(${p.id},${i})">${p.revealed?`<i class="bar" style="width:${total?counts[i]/total*100:0}%"></i>`:''}<span>${esc(o)} ${mine===i?'✓':''}${p.revealed?` <strong style="float:right">${counts[i]} · ${total?Math.round(counts[i]/total*100):0}%</strong>`:''}</span></button>`).join('')}${facilitator()?`<div class="poll-actions"><button onclick="toggleVoting(${p.id})">${p.open?'Close voting':'Reopen voting'}</button><button onclick="revealPoll(${p.id})">${p.revealed?'Hide results':'Reveal results'}</button></div><p class="form-help" style="margin-top:10px">Switch to ${isSim()?'Player':'Participant'} and enter the targeted room to cast a demo vote.</p>`:`<p class="form-help" style="margin-top:10px">${mine!==undefined?'Your response is recorded in this tab.':p.open?'Choose one option. You can change your response while voting is open.':'Voting has closed.'}</p>`}</article>`}
function voterKey(){return 'sample-'+(isSim()?ui.simTeam:demoGroup())+'-'+demoRole()}
function createPoll(){modal(`<div class="eyebrow">LIVE POLL</div><h2 style="margin-top:10px">Ask the right room.</h2><p>One question, one choice per participant. Results stay hidden until you reveal them.</p><div class="field"><label for="pollQuestion">Question</label><input id="pollQuestion" placeholder="Which evidence should we verify first?"></div><div class="field"><label for="pollAudience">Audience</label><select id="pollAudience"><option value="main">Main room</option><option value="all" ${currentVenue()!=='main'?'selected':''}>All breakout rooms · separate room results</option>${roomIds().map(id=>`<option value="${id}">${roomName(id)} only</option>`).join('')}</select></div><div class="field"><label for="pollOptions">Answer options · one per line</label><textarea id="pollOptions" placeholder="Repayment terms&#10;Revenue assumptions&#10;Existing debt profile"></textarea></div><footer><button onclick="closeModal()">Cancel</button><button class="primary" onclick="savePoll()">Open poll</button></footer>`)}
function savePoll(){let q=document.getElementById('pollQuestion').value.trim(),options=document.getElementById('pollOptions').value.split('\n').map(x=>x.trim()).filter(Boolean),aud=document.getElementById('pollAudience').value;if(!q||options.length<2||options.length>8){notify('Add a question and between 2 and 8 answer options');return}if(new Set(options.map(x=>x.toLowerCase())).size!==options.length){notify('Use distinct answer options');return}ui.polls.push({id:Date.now(),mode:ui.mode,question:q,options,rooms:aud==='all'?roomIds():[aud],votes:{},open:true,revealed:false});ui.panel='polls';ui.panelOpen=true;closeModal();render();notify('Poll opened for '+(aud==='all'?'all four breakout rooms':roomName(aud))+' · demo')}
function castVote(id,i){let p=ui.polls.find(x=>x.id===id);if(!p||!p.open||facilitator()||!p.rooms.includes(currentRoom()))return;let r=currentRoom();p.votes[r]=p.votes[r]||{};p.votes[r][voterKey()]=i;render();notify('Vote recorded · sample participant')}
function selectPollRoom(id,room){ui.pollRoom=ui.pollRoom||{};ui.pollRoom[id]=room;render()}
function toggleVoting(id){if(!facilitator())return;let p=ui.polls.find(x=>x.id===id);p.open=!p.open;render();notify(p.open?'Voting reopened':'Voting closed')}
function revealPoll(id){if(!facilitator())return;let p=ui.polls.find(x=>x.id===id);p.revealed=!p.revealed;render();notify(p.revealed?'Results revealed to assigned rooms':'Results hidden from assigned rooms')}
function controlPanel(){return `<div class="row between" style="margin-bottom:14px"><span class="pill">Turn ${ui.simTurn}</span><span class="note">${phases[ui.simPhase]}</span></div><div class="card"><span class="mini-label">FACILITATOR CONTROL</span><h3 style="font-size:16px;margin:8px 0">Set the pace. Keep the record.</h3><p class="note">Progression and outcomes require a human decision. Nothing is adjudicated automatically.</p><button class="primary btnblock" onclick="advancePhase()">${ui.simPhase===3?'Start next turn':'Advance to '+phases[ui.simPhase+1]}</button><button class="btnblock" onclick="ui.simRooms=true;ui.simVenue='breakouts';ui.panel='rooms';render();notify('Team rooms opened · simulated')">Open team rooms</button></div><div class="row between" style="margin:20px 0 12px"><h3>Event injects</h3><button class="small" onclick="injectForm()">+ Release inject</button></div>${ui.simInjects.length?ui.simInjects.map(x=>`<div class="sim-resource"><span class="mini-label">${x.audience==='all'?'ALL TEAMS':teamNames[Number(x.audience)]} · RELEASED</span><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join(''):'<div class="empty-state">No injects released.<br>Release information to selected teams when ready.</div>'}<div class="row between" style="margin:20px 0 12px"><h3>Proposed actions</h3><span class="pill">${ui.proposals.filter(p=>p.status==='submitted').length} pending</span></div>${ui.proposals.map((p,i)=>`<div class="sim-resource"><span class="mini-label">${teamNames[p.team]} · ${esc(p.status)}</span><h3>${esc(p.title)}</h3><p>${esc(p.rationale)}</p><button onclick="adjudicateForm(${i})">Review & draft outcome</button></div>`).join('')||'<div class="empty-state">No team actions submitted.<br>Switch to Player to propose an action.</div>'}`}
function advancePhase(){modal(`<div class="eyebrow">WHITE CELL · PHASE TRANSITION</div><h2 style="margin-top:10px">${ui.simPhase===3?'Start turn '+(ui.simTurn+1):'Advance to '+phases[ui.simPhase+1]}?</h2><p>${ui.proposals.filter(p=>p.status==='submitted').length} proposed actions remain pending. Advancing is recorded; it does not invent outcomes or clear unresolved actions.</p><footer><button onclick="closeModal()">Cancel</button><button class="primary" onclick="commitPhase()">Confirm progression</button></footer>`)}
function commitPhase(){if(ui.simPhase===3){ui.simTurn++;ui.simPhase=0}else ui.simPhase++;ui.simLog.push({turn:ui.simTurn,text:'Advanced to '+phases[ui.simPhase]});closeModal();render();notify('Scenario advanced · human-confirmed transition')}
function injectForm(){modal(`<div class="eyebrow">WHITE CELL · INFORMATION RELEASE</div><h2 style="margin-top:10px">Release a scenario inject.</h2><p>Recipients receive the information in their resources and room messages. This does not automatically change scenario outcomes.</p><div class="field"><label for="injectTitle">Inject title</label><input id="injectTitle" value="Revenue forecast revised"></div><div class="field"><label for="injectAudience">Recipients</label><select id="injectAudience"><option value="all">All teams</option>${teamNames.map((n,i)=>`<option value="${i}">${n} only</option>`).join('')}</select></div><div class="field"><label for="injectText">Information to release</label><textarea id="injectText">An independent review estimates project revenue may be 30% below the initial forecast. The estimate is provisional; the assumptions have not yet been verified.</textarea></div><footer><button onclick="closeModal()">Cancel</button><button class="primary" onclick="releaseInject()">Release to recipients</button></footer>`)}
function releaseInject(){let title=document.getElementById('injectTitle').value.trim(),text=document.getElementById('injectText').value.trim(),audience=document.getElementById('injectAudience').value;if(!title||!text){notify('Add an inject title and information');return}ui.simInjects.push({id:Date.now(),title,text,audience,turn:ui.simTurn});let target=audience==='all'?'all':'room-'+audience;sendTo(target,'NEW INJECT · '+title+'\n'+text,'White Cell');ui.simLog.push({turn:ui.simTurn,text:'Released '+title+' to '+(audience==='all'?'all teams':teamNames[Number(audience)])});closeModal();render();notify('Inject released to '+(audience==='all'?'all teams':teamNames[Number(audience)]))}
function proposalForm(){modal(`<div class="eyebrow">${teamNames[ui.simTeam]} · TURN ${ui.simTurn}</div><h2 style="margin-top:10px">Propose an action.</h2><p>Your action goes to White Cell for human review. Submission is not approval or execution.</p><div class="field"><label for="actionTitle">Proposed action</label><input id="actionTitle" placeholder="Request conditional bridge financing"></div><div class="field"><label for="actionRationale">Objective and rationale</label><textarea id="actionRationale" placeholder="What are you trying to achieve, and what evidence supports this action?"></textarea></div><div class="field"><label for="actionCommitment">Authority, resources, and conditions</label><textarea id="actionCommitment" placeholder="What can you credibly commit? What requires approval?"></textarea></div><footer><button onclick="closeModal()">Cancel</button><button class="primary" onclick="submitAction()">Submit to White Cell</button></footer>`)}
function submitAction(){let title=document.getElementById('actionTitle').value.trim(),rationale=document.getElementById('actionRationale').value.trim(),commitment=document.getElementById('actionCommitment').value.trim();if(!title||!rationale||!commitment){notify('Complete the action, rationale, and authority fields');return}ui.proposals.push({team:ui.simTeam,title,rationale,commitment,turn:ui.simTurn,status:'submitted'});ui.simLog.push({turn:ui.simTurn,text:teamNames[ui.simTeam]+' submitted an action for review'});closeModal();render();notify('Action submitted · awaiting human review')}
function adjudicateForm(i){if(!facilitator())return;let p=ui.proposals[i];modal(`<div class="eyebrow">WHITE CELL · ${teamNames[p.team]}</div><h2 style="margin-top:10px">${esc(p.title)}</h2><div class="source-panel"><strong>Rationale:</strong> ${esc(p.rationale)}<br><br><strong>Authority & conditions:</strong> ${esc(p.commitment)}</div><div class="field"><label for="outcomeStatus">Review decision</label><select id="outcomeStatus"><option value="returned">Return for clarification</option><option value="accepted">Accept proposed action</option><option value="declined">Decline proposed action</option></select></div><div class="field"><label for="outcomeText">Outcome or explanation</label><textarea id="outcomeText" placeholder="Record the adjudication rationale. State any conditional consequences explicitly."></textarea></div><div class="field"><label for="outcomeAudience">Publish to</label><select id="outcomeAudience"><option value="team">Submitting team only</option><option value="all">All teams</option></select></div><footer><button onclick="closeModal()">Cancel</button><button class="primary" onclick="publishOutcome(${i})">Confirm & publish outcome</button></footer>`)}
function publishOutcome(i){if(!facilitator())return;let p=ui.proposals[i],text=document.getElementById('outcomeText').value.trim();if(!text){notify('Add an outcome or explanation');return}p.status=document.getElementById('outcomeStatus').value;let audience=document.getElementById('outcomeAudience').value;ui.outcomes.push({team:p.team,title:p.title,text,status:p.status,audience,turn:ui.simTurn});sendTo(audience==='all'?'all':'room-'+p.team,'WHITE CELL REVIEW · '+p.title+'\n'+p.status.toUpperCase()+'\n'+text,'White Cell');ui.simLog.push({turn:ui.simTurn,text:'White Cell '+p.status+' action from '+teamNames[p.team]});closeModal();render();notify('Human-reviewed outcome published to '+(audience==='all'?'all teams':teamNames[p.team]))}
function simBuild(){return title('SCENARIO DELIVERY','One room. Several perspectives.','Configure the delivery structure for a facilitated simulation.',`<button class="primary" onclick="state.view='run';ui.panel='control';render()">Rehearse delivery</button>`)+`<div class="layout"><section><div class="card" style="margin-bottom:20px"><span class="eyebrow">FICTIONAL SCENARIO · KAVALA</span><h2 style="font-size:28px;letter-spacing:-1px;margin:12px 0">Financing Assurances</h2><p class="note">A $750m Eurobond maturity, a six-week scenario clock, and four teams with different mandates. Designed for a human-led decision exercise.</p><div class="tags" style="margin-top:18px"><span>Private role briefs</span><span>Selective injects</span><span>Proposed actions</span><span>Human adjudication</span></div></div><div class="simulation-rooms">${teamNames.map((n,i)=>`<div class="card"><span class="eyebrow">TEAM ${i+1}</span><h2 style="margin:10px 0">${n}</h2><p class="note">${esc(briefs[i].mission)}</p><button class="small" style="margin-top:16px" onclick="editTeamBrief(${i})">Edit mandate & private brief</button></div>`).join('')}</div></section><aside><div class="card"><span class="eyebrow">DELIVERY PHASES</span>${phases.map((p,i)=>`<div class="step"><span class="stepnum">${i+1}</span><div><strong>${p}</strong><p class="note">${['Distribute shared and role-specific information.','Teams exchange questions and consider options.','Submit actions; White Cell reviews authority and consequences.','Compare decisions, assumptions, and outcomes.'][i]}</p></div></div>`).join('')}<p class="form-help" style="margin-top:15px">The six-week scenario clock is distinct from the live-session clock. This mockup does not run a simulation model.</p></div></aside></div>`}
function editTeamBrief(i){modal(`<h2>${teamNames[i]} brief</h2><div class="field"><label for="teamMission">Shared team mandate</label><textarea id="teamMission">${esc(briefs[i].mission)}</textarea></div><div class="field"><label for="teamPrivate">Private team information</label><textarea id="teamPrivate">${esc(briefs[i].private)}</textarea></div><footer><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTeamBrief(${i})">Save brief</button></footer>`)}
function saveTeamBrief(i){let mission=document.getElementById('teamMission').value.trim(),privateText=document.getElementById('teamPrivate').value.trim();if(!mission||!privateText){notify('Complete both brief fields');return}briefs[i].mission=mission;briefs[i].private=privateText;closeModal();render();notify('Team brief updated in this tab')}
function simReview(){return title('SIMULATION RECORD','Reconstruct the decision.','Human-authored decisions, released information, and facilitator outcomes.',`<button onclick="exportSimulation()">Export record ↓</button><button class="primary" onclick="state.view='run';ui.simVenue='main';ui.simPhase=3;ui.panel='agenda';render()">Open debrief</button>`)+`<div class="stats"><div class="stat"><strong>${ui.simInjects.length}</strong><span class="note">Injects released</span></div><div class="stat"><strong>${ui.proposals.length}</strong><span class="note">Team actions proposed</span></div><div class="stat"><strong>${ui.outcomes.length}</strong><span class="note">Human-reviewed outcomes</span></div></div><div class="layout"><section><div class="card"><h2 style="margin-bottom:16px">Exercise timeline</h2>${ui.simLog.map(x=>`<div class="timeline-event"><time>Turn ${x.turn}</time><div>${esc(x.text)}</div></div>`).join('')||'<div class="empty-state">Your exercise record starts when you release an inject, advance a phase, or submit an action.</div>'}</div>${ui.outcomes.map(x=>`<div class="evidence" style="margin-top:18px"><span class="eyebrow">${teamNames[x.team]} · ${x.status} · ${x.audience==='all'?'ALL TEAMS':'SUBMITTING TEAM ONLY'}</span><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join('')}</section><aside><div class="card"><span class="eyebrow">DEBRIEF PROMPTS</span><h2 style="margin:12px 0">Explore the reasoning.</h2><div class="step">Which information shaped the decision?</div><div class="step">What did each team assume about the others?</div><div class="step">Which commitment exceeded its authority?</div><div class="step">What would you do differently with the same evidence?</div><p class="form-help">This facilitator record contains team-restricted material. Participant distribution must be explicitly scoped in a production implementation.</p></div></aside></div>`}
function exportSimulation(){let b=new Blob([JSON.stringify({prototype:true,scenario:'Financing Assurances · fictional',scope:'facilitator-only local export',turn:ui.simTurn,phase:phases[ui.simPhase],injects:ui.simInjects,proposals:ui.proposals,outcomes:ui.outcomes,log:ui.simLog},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='debrio-simulation-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function sessionOptions(){modal(`<h2>Session controls</h2><p>This is an interactive prototype. No actual camera, microphone, room routing, or messages are transmitted.</p><div class="list"><button onclick="closeModal();ui.panel='polls';ui.panelOpen=true;render()">Open polls</button><button onclick="closeModal();ui.panel='resources';ui.panelOpen=true;render()">Open resources</button><button onclick="closeModal();ui.panel='chat';ui.panelOpen=true;render()">Messages & requests for information</button>${facilitator()?'<button onclick="closeModal();returnEveryone()">Return everyone to main room</button>':''}<button onclick="location.reload()">Reset this prototype</button></div><footer><button onclick="closeModal()">Close</button></footer>`)}
function leaveSession(){modal(`<h2>Leave this preview?</h2><p>Your sample state stays in this tab until refresh. You can return to the meeting after reviewing the record.</p><footer><button onclick="closeModal()">Stay in meeting</button><button class="primary" onclick="closeModal();state.view='review';render()">Leave & review record</button></footer>`)}
// Retain the original authoring and resource dialogs in the new meeting shell.
function previewResources(){state.role='participant';state.view='run';state.venue='breakouts';ui.panel='resources';ui.panelOpen=true;if(state.resourceGroupFilter!==null)state.demoGroup=state.resourceGroupFilter;closeModal();render()}
function showMyResources(){state.view='run';ui.panel='resources';ui.panelOpen=true;render()}
function setRole(role){stopMedia(false);ui.monitor=null;state.role=role;ui.lobby=!(ui.joined&&ui.joined[ui.mode+':'+role]);if(role==='participant'&&!ui.lobby&&ui.justAdmitted){ui.justAdmitted=false;setTimeout(()=>notify((isSim()?'White Cell':'Sethu')+' let you in'),0)}if(isSim()&&facilitator())ui.panel='control';if(!facilitator()&&ui.panel==='control')ui.panel='agenda';render()}
function message(target){messageRoom(target==='all rooms'?'all':target==='Baobab'?'room-1':target)}
function resetDemo(){location.reload()}
// First use opens a clear main-room view; the mode switch reveals the second delivery context.
state.seconds=300;state.venue='main';state.view='run';render();

function playerReview(){let own=ui.outcomes.filter(x=>x.audience==='all'||x.team===ui.simTeam);return title('TEAM RECORD',teamNames[ui.simTeam]+' · exercise record','Your proposals and outcomes shared with your team.',`<button class="primary" onclick="state.view='run';render()">Return to meeting</button>`)+`<div class="card"><h2>Your proposed actions</h2>${ui.proposals.filter(x=>x.team===ui.simTeam).map(x=>`<div class="source-panel"><strong>${esc(x.title)}</strong><p>${esc(x.rationale)}</p><span class="note">${esc(x.status)}</span></div>`).join('')||'<p class="note">No actions submitted yet.</p>'}</div><div class="card" style="margin-top:20px"><h2>Outcomes shared with you</h2>${own.map(x=>`<div class="source-panel"><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p></div>`).join('')||'<p class="note">No outcomes shared yet.</p>'}</div>`}

document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.add('no-tips')});document.addEventListener('pointermove',()=>document.body.classList.remove('no-tips'));document.addEventListener('focusin',()=>document.body.classList.remove('no-tips'));
function toggleTheme(){const dark=!document.body.classList.contains('dark');document.body.classList.toggle('dark',dark);try{localStorage.setItem('debrio-matte-theme',dark?'dark':'light')}catch{}render()}
try{document.body.classList.toggle('dark',localStorage.getItem('debrio-matte-theme')!=='light')}catch{}
render();
installTransitions();
runSplash();

</script></body></html>

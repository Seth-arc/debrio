  .context-switch button,.switch button{padding:0 10px;font-size:12px}
  .content{padding:18px 14px 24px}
  .meeting-canvas{padding:8px;border-radius:var(--r-lg)}
  .presentation{padding:48px 18px 22px;min-height:0}
  .presentation :is(h1,h2){font-size:26px}
  .presentation p{font-size:14px}
  .slide-brief{grid-template-columns:minmax(0,1fr);gap:10px}
  .slide-footer{margin-top:22px}
  .situation-card strong{font-size:18px}
  .film-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .person-initials{width:32px;height:32px;font-size:11px}
  .meeting-footer{grid-template-columns:minmax(0,1fr);justify-items:center;gap:8px;margin:12px -14px 0;padding:8px 10px}
  .device-dock{gap:4px}
  .dock-button{width:38px;height:38px;border-radius:10px}
  .dock-button.leave{width:46px}
  .dock-divider{display:none}
  .tool-dock{justify-self:center;justify-content:center;flex-wrap:wrap}
  .device-dock{padding:3px}
  .list>.planstep::before{left:31px}
  .list>.planstep{padding:16px 18px}
  .tool-button{min-height:34px;padding:0 8px}
  .panel-room.selected{margin:0 -18px}
  .stats,.grid,.resource-summary{grid-template-columns:minmax(0,1fr)}
  .rooms-overview{grid-template-columns:minmax(0,1fr)}
  .evidence>.row.between:first-child{position:static;justify-content:flex-start;margin-bottom:10px}
  .evidence>:is(h2,h3){padding-right:0}
  .planstep{grid-template-columns:28px minmax(0,1fr)}
  .planstep>button{grid-column:2;justify-self:start}
  .assignment-grid{grid-template-columns:minmax(0,1fr)}
  .modal{padding:20px}
  .resource-card footer{flex-direction:column;align-items:flex-start}
  th,td{padding:10px 6px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- Accessibility and quality ---------- */
.skip-link{position:fixed;top:10px;left:10px;z-index:60;padding:10px 14px;border-radius:var(--r-md);background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none;transform:translateY(-200%)}
.skip-link:focus{transform:none}
#app:focus,#app h1:focus{outline:none}
/* Hover/focus tooltips can be dismissed with Escape (WCAG 1.4.13) */
.no-tips [aria-label]::after{opacity:0!important}
.act-title{font-size:18px}
.evidence-title{font-size:19px}
/* Narrow screens: tool names stay in the accessibility tree, just not on screen */
@media (max-width:1280px){.tool-label{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media (max-width:640px){.row{flex-wrap:wrap}}
@media (max-width:400px){
  .device-dock .dock-button{width:34px;height:36px}
  .device-dock .dock-button.leave{width:40px}
  .tool-button{padding:0 7px}
}
/* Tooltips are generated only while shown, so hidden ones never widen the page (WCAG 1.4.10) */
:is(.dock-button,.theme-toggle,.icon-btn,.room-icon)[aria-label]::after{content:none}
:is(.dock-button,.theme-toggle,.icon-btn,.room-icon)[aria-label]:is(:hover,:focus-visible)::after{content:attr(aria-label);animation:tip-in .12s ease .35s both}
@keyframes tip-in{from{opacity:0}to{opacity:1}}
/* ---------- Lobby (pre-join) ---------- */
.lobby{flex:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:clamp(24px,4vw,64px);align-items:center;width:100%;max-width:1080px;margin:auto;padding:24px 0 48px}
.lobby-preview{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.lobby-video{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:16/10;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--tile-bg);overflow:hidden}
.lobby-video.cam-on{background:var(--paper)}
.lobby-video .person-initials{width:96px;height:96px;font-size:30px;--av:#D3DBE4;--av-ink:#3F5568}
body.dark .lobby-video .person-initials{--av:#25333F;--av-ink:#A8BDD0}
.lobby-you{position:absolute;left:14px;bottom:12px;padding:3px 9px;border-radius:var(--r-sm);background:var(--paper);color:var(--ink);font-size:12px;font-weight:600}
.lobby-mic{position:absolute;right:12px;bottom:12px;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:28px;height:28px;padding:7px;border-radius:var(--r-sm);background:var(--paper);color:var(--danger-text)}
.lobby-mic svg{width:14px;height:14px;align-self:center}
.lobby-mic i{width:3px;border-radius:2px;background:var(--accent-line);animation:lobby-level .9s ease-in-out infinite alternate}
.lobby-mic i:nth-child(1){height:6px}
.lobby-mic i:nth-child(2){height:12px;animation-delay:.25s}
.lobby-mic i:nth-child(3){height:8px;animation-delay:.5s}
@keyframes lobby-level{to{transform:scaleY(.4)}}
.lobby-mic i{transform-origin:bottom}
.lobby-join{display:flex;flex-direction:column;gap:18px;min-width:0}
.lobby-title{font-size:clamp(26px,2.4vw,34px);font-weight:650;letter-spacing:-.025em;line-height:1.1}
.lobby-present{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.lobby-present .tiny-avatar{width:26px;height:26px;margin-left:-6px;border:2px solid var(--bg);background:var(--raised);color:var(--ink-2);font-size:9px;font-weight:650}
.lobby-present .tiny-avatar:first-child{margin-left:0}
.lobby-devices{display:flex;flex-direction:column;gap:8px}
.lobby-device{position:relative;display:flex;align-items:center}
.lobby-device>svg{position:absolute;left:12px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.lobby-device select{padding-left:38px;background-color:var(--paper)}
.lobby-join-btn{min-height:46px;font-size:15px}
.lobby-join-btn:focus-visible{outline-offset:3px}
@media (max-width:900px){
  .lobby{grid-template-columns:minmax(0,1fr);align-items:start;padding-top:8px}
  .lobby-video .person-initials{width:72px;height:72px;font-size:22px}
}
@media (max-width:900px){.lobby{gap:28px}}
/* ---------- Admission: lobby waiting state, people control, People panel ---------- */
.lobby-status{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:var(--r-md);background:var(--paper);border:1px solid var(--line);color:var(--ink-2);font-size:14px}
.lobby-status.denied{color:var(--danger-text)}
.lobby-status svg{width:16px;height:16px}
.lobby-pulse{width:8px;height:8px;border-radius:50%;background:var(--accent-line);animation:lobby-pulse 1.4s ease-in-out infinite}
@keyframes lobby-pulse{50%{opacity:.25}}
.heading-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.people-btn{gap:7px;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunken);color:var(--ink-2);font-variant-numeric:tabular-nums}
.people-btn svg{width:17px;height:17px}
.people-btn:hover{background:var(--hover);color:var(--ink)}
.people-btn.on{background:var(--raised);color:var(--ink);border-color:var(--line-strong)}
.people-count{font-weight:600}
.people-waiting{display:inline-flex;align-items:center;gap:6px;margin-left:3px;padding-left:9px;border-left:1px solid var(--line-strong);color:var(--danger-text);font-weight:600}
.people-waiting::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--danger)}
.people-group+.people-group{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.people-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.people-head h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.people-head h3 span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.people-list{list-style:none;margin:0;padding:0}
.person-row{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 0;font-size:13px}
.person-row .tiny-avatar{width:28px;height:28px;flex-shrink:0;background:var(--raised);color:var(--ink-2);font-size:10px;font-weight:650}
.person-row-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-row-tag{margin-left:4px;padding:1px 6px;border-radius:var(--r-xs);background:var(--raised);color:var(--muted);font-size:11px;font-weight:600}
.person-row-actions{display:flex;align-items:center;gap:4px}
.person-row-actions .room-icon{width:30px;min-height:30px;padding:0;border-color:transparent;background:transparent;color:var(--muted);border-radius:var(--r-sm)}
.person-row-actions .room-icon:hover{background:var(--hover);color:var(--danger-text)}
.person-row-actions .room-icon svg{width:15px;height:15px}
.person-row-actions .room-icon[aria-label]::after{right:0}
.person-row.waiting .person-row-name{font-weight:550}
/* ==========================================================================
   Motion built from the mark: four rooms converge into one square; the dot is
   where the screen collapses to. Skipped entirely under prefers-reduced-motion.
   ========================================================================== */
.sr-only{position:absolute!important;width:1px!important;height:1px!important;margin:-1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
.mk-body,.sp-body,.sp-q{fill:var(--ink)}
.mk-dot{fill:var(--accent-line)}

/* Loading page */
#splash{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg);color:var(--ink);clip-path:circle(var(--r,150%) at var(--x,50%) var(--y,50%));transition:clip-path .6s cubic-bezier(.6,0,.35,1)}
#splash.out{clip-path:circle(0 at var(--x,50%) var(--y,50%))}
.splash-mark{width:68px;height:68px;overflow:visible}
.sp-q{transform-box:fill-box;transform-origin:center;opacity:0;animation:sp-converge .62s cubic-bezier(.2,.8,.2,1) forwards}
.sp-q1{--tx:-12px;--ty:-12px}
.sp-q2{--tx:12px;--ty:-12px;animation-delay:.07s}
.sp-q3{--tx:-12px;--ty:12px;animation-delay:.14s}
.sp-q4{--tx:12px;--ty:12px;animation-delay:.21s}
@keyframes sp-converge{from{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.55)}to{opacity:1;transform:none}}
.sp-body{opacity:0;animation:sp-fade .22s ease .8s forwards}
.sp-quads{animation:sp-gone 0s linear 1.02s forwards}
.sp-dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:sp-dot .42s cubic-bezier(.3,1.5,.5,1) 1s forwards,sp-breathe 1.8s ease-in-out 1.7s infinite}
.splash-word{font-size:21px;font-weight:650;letter-spacing:-.045em;opacity:0;transform:translateY(4px);animation:sp-word .45s ease 1.15s forwards}
@keyframes sp-fade{to{opacity:1}}
@keyframes sp-gone{to{opacity:0}}
@keyframes sp-dot{to{transform:scale(1)}}
@keyframes sp-breathe{50%{opacity:.45}}
@keyframes sp-word{to{opacity:1;transform:none}}

/* Context transition: a dot grows from the click, the mark lands, the screen collapses into its dot */
.mark-wipe{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);clip-path:circle(0 at var(--x) var(--y));transition:clip-path .32s cubic-bezier(.3,0,.2,1)}
.mark-wipe.in{clip-path:circle(var(--r) at var(--x) var(--y))}
.mark-wipe.landed{transition:none}
.mark-wipe.out{clip-path:circle(0 at var(--x) var(--y));transition:clip-path .44s cubic-bezier(.6,0,.35,1)}
.mark-wipe svg{width:56px;height:56px;overflow:visible;opacity:0;transform:scale(.86);transition:opacity .18s ease,transform .28s cubic-bezier(.2,.8,.2,1)}
.mark-wipe.landed svg{opacity:1;transform:none}
.mark-wipe .mk-dot{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .26s cubic-bezier(.3,1.5,.5,1) .06s}
.mark-wipe.landed .mk-dot{transform:scale(1)}

</style></head><body class="dark"><script>try{if(localStorage.getItem('debrio-matte-theme')==='light')document.body.classList.remove('dark')}catch(e){}</script><div id="splash" role="status"><span class="sr-only">Loading Debrio</span><svg class="splash-mark" viewBox="0 0 44 44" aria-hidden="true" focusable="false"><g class="sp-quads"><rect class="sp-q sp-q1" width="22" height="22" rx="6"/><rect class="sp-q sp-q2" x="22" width="22" height="22" rx="6"/><rect class="sp-q sp-q3" y="22" width="22" height="22" rx="6"/><rect class="sp-q sp-q4" x="22" y="22" width="22" height="22" rx="6"/></g><path class="sp-body" d="M14 0H30A14 14 0 0 1 44 14V30A14 14 0 0 1 30 44H4A4 4 0 0 1 0 40V14A14 14 0 0 1 14 0Z"/><circle class="mk-dot sp-dot" cx="27" cy="27" r="7"/></svg><span class="splash-word" aria-hidden="true">debrio</span></div><a class="skip-link" href="#app">Skip to content</a><div class="shell"><aside class="sidebar" aria-label="Workspace"><div class="logo"><span class="mark"></span>debrio</div><nav class="nav" aria-label="Workspaces"><button type="button" data-nav="build"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12.5 9 5 9-5M3 17l9 5 9-5"/></svg></span>Build</button><button type="button" data-nav="run"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/><path d="m10 8.2 4.5 2.3-4.5 2.3V8.2Z"/></svg></span>Run session</button><button type="button" data-nav="review"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6V3Z"/><path d="M14 3v5h5M9.5 14l2 2 4-4"/></svg></span>Review</button></nav><div class="sidebar-bottom"><div class="row"><span class="avatar">SN</span><div><strong>Sethu Nguna</strong><div class="note">Facilitator workspace</div></div></div><p class="demo">Interactive concept · v0.3<br>Sample data · simulated media</p><button type="button" class="quiet small" onclick="resetDemo()">Reset demo</button></div></aside><main class="main"><header class="topbar"><div class="row muted">Training workspace / Development finance</div><div class="row"><span class="demo">INTERACTIVE PROTOTYPE</span><div class="switch" role="group" aria-label="Preview role"><button type="button" id="fac" onclick="setRole('facilitator')">Facilitator</button><button type="button" id="par" onclick="setRole('participant')">Participant</button></div></div></header><div id="app" class="content" tabindex="-1"></div></main></div><div id="overlay"></div><div id="toast" role="status" class="hidden"></div>
<script>
const steps=[{name:'Individual interpretation',scope:'Individual · private response',time:5,task:'What can this financing claim tell us?',tool:'Response + confidence',output:'Interpretation and supporting evidence'},{name:'Group comparison',scope:'Group · common task',time:12,task:'Compare interpretations. Make the case.',tool:'Shared assessment',output:'Three risks, one priority, a rationale'},{name:'Gallery critique',scope:'Peer review · move work',time:8,task:'Challenge the reasoning, not the conclusion.',tool:'Artifact + rubric',output:'Criterion feedback for Group Cedar'},{name:'Revise your assessment',scope:'Group · feedback and retry',time:8,task:'What would you change, and why?',tool:'Before / after + feedback',output:'Revised assessment and change rationale'},{name:'Individual transfer',scope:'Individual · private response',time:5,task:'Apply your judgment to a different case.',tool:'New case response',output:'Individual application and rationale'},{name:'Evidence-based debrief',scope:'Plenary · curated evidence',time:12,task:'What changed your mind?',tool:'Evidence comparison',output:'Reflections and agreed actions'}];
let state={view:'run',venue:'main',role:'facilitator',step:0,edit:1,seconds:9*60+42,paused:false,room:null,mode:'',ack:false,pins:[0,1],published:false,protocol:'Gallery critique',responses:{},feedback:'',revision:'',mic:false,cam:false,help:false},scanTimer=null;
const rooms=[{name:'Acacia',people:['AM','TK','JO','LN','ED'],done:2,note:'Comparing evidence sources',color:'#e5e6ea'},{name:'Baobab',people:['NK','ZM','SR','KA','PL'],done:1,note:'Question pending · interpreting exposure',help:true},{name:'Cedar',people:['AT','DM','RB','KG','SS'],done:3,note:'First assessment submitted'},{name:'Ebony',people:['FN','JT','MA','PN','CL'],done:2,note:'Drafting a shared rationale'}];
const ev=[{title:'The assumption that changed',tag:'Group Acacia · attempts 1 → 2',before:'The loan amount alone suggests an unsustainable debt burden.',after:'The amount is insufficient evidence. We need repayment terms, revenue exposure, and the wider debt profile.',question:'Which additional evidence changed the strength of this claim?'},{title:'Same evidence. Different priorities.',tag:'Groups Baobab + Cedar · submitted judgments',before:'Prioritize the refinancing risk before considering the project benefits.',after:'First establish whether the revenue assumptions are credible.',question:'What explains the difference in priorities?'},{title:'A useful challenge',tag:'Gallery critique · rubric v1',before:'The argument identifies a risk but treats an estimate as a confirmed liability.',after:'Distinguish the reported figure, your inference, and the evidence still needed.',question:'How should uncertainty appear in a responsible assessment?'}];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pill=(x,cl='')=>`<span class="pill ${cl}">${x}</span>`;const clock=()=>`${String(Math.floor(state.seconds/60)).padStart(2,'0')}:${String(state.seconds%60).padStart(2,'0')}`;
function notify(t){let n=document.getElementById('toast');n.textContent=t;n.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.add('hidden'),3500)}
function setRole(role){stopMedia(false);state.role=role;render()}function nav(v){stopMedia(false);state.view=v;state.role='facilitator';render()}document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));
function title(k,h,desc,actions=''){return `<div class="titlebar row between"><div><div class="eyebrow">${k}</div><h1>${h}</h1><div class="sub">${desc}</div></div><div class="row">${actions}</div></div>`}
function timeline(){return `<div class="card"><div class="row between cardhead"><h3>Session flow</h3><span class="note">50 min</span></div>${steps.map((s,i)=>`<div class="step ${i===state.step?'current':''}"><span class="stepnum">${i<state.step?'✓':i+1}</span><div><strong>${s.name}</strong><div class="muted">${s.time} min · ${i<state.step?'Completed':i===state.step?'Current step':'Up next'}</div></div></div>`).join('')}</div>`}
function run(){return title('LIVE WORKSHOP', 'Reading the financing story','Practice-based training · 20 participants · 4 breakout rooms',`${pill('● Live')}<button onclick="showTransition()" class="primary">${state.step===5?'Close workshop':'Next step'}</button>`)+`<div class="layout"><section><div class="activity"><div><div class="eyebrow">STEP ${state.step+1} OF 6 · ${steps[state.step].scope}</div><h2>${steps[state.step].name}</h2><p>${steps[state.step].output}</p></div><div class="row"><div><div class="clock" id="clock">${clock()}</div><div class="row"><button class="small" onclick="state.paused=!state.paused;render()">${state.paused?'Resume':'Pause'}</button><button class="small" onclick="state.seconds+=120;render()">+2 min</button></div></div></div></div><div class="row between cardhead"><h2>${state.step===5?'Debrief selections':'Your breakout rooms'}</h2><button class="quiet small" onclick="message('all rooms')">Message all ↗</button></div>${state.step===5?evidenceCards(true):`<div class="grid">${rooms.map((r,i)=>`<article class="room ${state.room===i?'selected':''}"><div class="row between"><h3>${r.name}</h3>${r.help&&!state.ack?pill('Help requested','amber'):pill(r.done===3?'Submitted':'Working')}</div><p>${r.note}</p><div class="row between"><div class="avatars">${r.people.map((p,j)=>`<span class="avatar" style="background:${['#dfe0e3','#dedfe3','#e0e1e3','#e2e3e5','#dddfe3'][j]}">${p}</span>`).join('')}</div><span class="note">5 people</span></div><div class="progress"><span style="width:${r.done/3*100}%"></span></div><div class="row between"><span class="note">${r.done} of 3 outputs</span><span class="note">Updated just now</span></div><div class="roomfoot"><button onclick="media(${i},'Listen')">◉ Listen</button><button onclick="media(${i},'Speak')">Speak</button><button onclick="media(${i},'Join')">Join ↗</button><button onclick="roomOutput(${i})">View work</button><button onclick="resourceManager(state.step,${i})">Resources</button></div></article>`).join('')}</div>`}<div class="row between" style="margin-top:18px"><span class="note">Progress reflects submitted work, not conversation activity.</span><button class="small quiet" onclick="scan()">↻ Scan rooms</button></div>${state.room!==null?`<div class="listener"><div class="wave">${'<i></i>'.repeat(8)}</div><div class="label">${state.mode==='Join'?'Joined':state.mode==='Speak'?'Speaking to':'Listening to'} ${rooms[state.room].name}<small>SIMULATED MEDIA · ${state.mode==='Speak'?'Microphone directed to this room only':'Room notified · microphone off'}</small></div><button class="small" onclick="media((state.room+1)%4,'Listen')">Next room</button><button class="small" onclick="stopMedia()">Stop</button></div>`:''}</section><aside><div class="card" style="margin-bottom:20px"><div class="row between"><h3>Needs your attention</h3>${pill(state.ack?'0':'1','amber')}</div><div class="help">${state.ack?`<p>All help requests acknowledged.</p><span class="note">You're ready to continue.</span>`:`<div class="row between"><strong style="font-size:12px">Baobab</strong><span class="note">1 min ago</span></div><p>“Should we assess the loan itself or the country's overall exposure?”</p><button class="small primary" onclick="state.ack=true;render();notify('Baobab notified: Sethu has acknowledged your request')">Acknowledge</button> <button class="small" onclick="message('Baobab')">Reply</button>`}</div></div>${timeline()}</aside></div>`}
function build(){let st=steps[state.edit];return title('WORKSHOP ENGINE','Design the learning journey','One plan. Every task, transition, and output connected.',`<button onclick="resourceManager()">Resources & assignments ↗</button><button onclick="protocolModal()">Protocols ↗</button><button class="primary" onclick="state.role='participant';state.view='run';state.venue='breakouts';ui.panel='agenda';ui.panelOpen=true;render();notify('Participant preview · sample group Acacia')">Preview participant</button>`)+`<div class="layout"><section><div class="card" style="margin-bottom:20px"><div class="eyebrow">LEARNING OBJECTIVE</div><p style="font:400 21px/1.5 Georgia,serif">Assess a development finance claim using evidence, uncertainty, and a defensible rationale.</p><div class="row between" style="margin-top:18px">${pill('✓ All step dependencies linked')}<span class="note">${esc(state.protocol)} protocol · editable</span></div></div><div class="list">${steps.map((s,i)=>`<div class="planstep ${i===state.edit?'selected':''}"><span class="stepnum">${i+1}</span><div><h2>${esc(s.name)}</h2><p>${s.scope} · ${s.time} min</p><div class="tags" style="margin-top:8px"><span>${resources.filter(r=>r.activity===i).length} assigned resources</span><span>${s.tool}</span><span>${i?'Uses step '+i:'No prerequisite'}</span></div></div><button onclick="state.edit=${i};render()">Configure ↗</button></div>`).join('')}</div></section><aside><div class="card"><div class="eyebrow">STEP ${state.edit+1} SETTINGS</div><h2 style="margin:10px 0 23px">${esc(st.name)}</h2><div class="field"><label for="stepName">Step name</label><input id="stepName" value="${esc(st.name)}"></div><div class="field"><label for="stepPrompt">Participant prompt</label><textarea id="stepPrompt">${esc(st.task)}</textarea></div><div class="field"><label for="duration">Duration (minutes)</label><input id="duration" type="number" min="1" max="120" value="${st.time}"></div><div class="field"><label>Required output</label><div class="note">${st.output}</div></div><div class="field"><label>Transition behavior</label><div class="note">${state.edit===2?'Move submitted work snapshots. Keep people in their rooms.':state.edit===0||state.edit===4?'Open a private individual response.':'Apply step instructions, tools, and role assignments.'}</div></div><button style="width:100%;margin-bottom:10px" onclick="resourceManager(state.edit)">Assign step resources</button><button class="primary" style="width:100%" onclick="saveStep()">Save step</button><p class="note">Changes apply to this local mockup.</p></div></aside></div>`}
function participantTask(){let s=steps[state.step];return `<div class="participant">${title('PARTICIPANT WORKSPACE',s.name,'Reading the financing story · You are in Group Acacia',`<button class="small" onclick="participantStages()">Explore steps ↗</button>`)}<div class="row between" style="margin-bottom:20px"><span class="pill">${state.step===0||state.step===4?'Private · you and your trainer':'Group Acacia · 5 participants'}</span><span class="note">Step ${state.step+1} of 6 · <span id="clock">${clock()}</span> remaining</span></div><div class="pgrid"><section class="card brief"><div class="eyebrow">YOUR TASK</div><h2>${esc(s.task)}</h2><p>${state.step===2?'Review Group Cedar’s submitted assessment using the criteria below. You can comment on their work; their original stays unchanged.':state.step===3?'Use the peer feedback to revise your assessment. Your first attempt remains available. Explain what changed in your reasoning.':state.step===4?'A different country has a smaller loan but a shorter repayment period. What would you need to investigate before judging the risk?': 'A headline claims that a $450 million infrastructure loan puts a country at risk of a debt crisis. What does the figure establish, and what remains uncertain?'}</p>${state.step===5?evidenceCards(true):state.step===2?`<div class="source"><div class="eyebrow">GROUP CEDAR · ATTEMPT 1 · READ ONLY</div><p>“The size of the loan creates a refinancing risk. We recommend prioritizing an assessment of repayment capacity before drawing conclusions about the project.”</p></div>${['Use of evidence','Treatment of uncertainty','Quality of rationale'].map((x,i)=>`<div class="field"><label for="rub${i}">${x}</label><select id="rub${i}"><option>Choose a descriptor</option><option>Clear and supported</option><option>Partially supported</option><option>Needs stronger evidence</option></select></div>`).join('')}<label for="answer">What would strengthen this assessment?</label><textarea id="answer" oninput="draft(this.value)" placeholder="Give specific, constructive feedback…">${esc(state.responses[state.step]||'')}</textarea>`:state.step===3?`<div class="feedback"><strong>Peer feedback · Cedar · rubric v1</strong><p>Separate the reported amount from the inferred debt risk. What repayment terms or revenue figures would support your conclusion?</p></div><div class="field"><label>First attempt · preserved</label><div class="source">The loan amount alone suggests an unsustainable debt burden.</div></div><label for="answer">Revised assessment</label><textarea id="answer" oninput="draft(this.value)" placeholder="Revise the assessment using the feedback…">${esc(state.responses[state.step]||'')}</textarea><div class="field" style="margin-top:15px"><label for="rationale">What changed, and why?</label><input id="rationale" value="${esc(state.revision)}" oninput="state.revision=this.value"></div>`:`<div class="source"><div class="eyebrow">CASE BRIEF · FICTIONAL TRAINING DATA</div><p>Reported commitment: $450m · Sector: transport<br>Repayment schedule: not supplied · Revenue forecast: not verified</p></div><div class="field"><label for="answer">${state.step===1?'Your group assessment':'Your interpretation and supporting evidence'}</label><textarea id="answer" oninput="draft(this.value)" placeholder="Distinguish what you know from what you infer…">${esc(state.responses[state.step]||'')}</textarea></div>${state.step===0?`<div class="field"><label for="confidence">Confidence in your interpretation</label><select id="confidence"><option>Still exploring</option><option>Moderately confident</option><option>Confident</option></select></div>`:''}`}<div class="row between" style="margin-top:20px"><span id="saveStatus" class="note">${state.responses[state.step]?'Draft saved in this tab':'Your work stays linked to this step'}</span>${state.step!==5?`<button class="primary" onclick="submitWork()">${state.step===2?'Submit feedback':state.step===3?'Submit revision':'Submit response'}</button>`:''}</div></section><aside><div class="card"><div class="row between"><h3>Your room</h3><span class="pill">Audio connected*</span></div>${state.room===0?`<div class="feedback">Sethu is ${state.mode==='Speak'?'speaking to':'listening to'} your room.</div>`:''}<div class="videos">${['Amina','Thabo','You','Lina'].map((x,i)=>`<div class="video"><span class="avatar">${['AM','TK','SN','LN'][i]}</span><small>${x} · ${i===2?(state.mic?'mic on*':'muted'):'muted'}</small></div>`).join('')}</div><div class="controls"><button class="small" onclick="state.mic=!state.mic;render()">${state.mic?'Mute':'Unmute'}</button><button class="small" onclick="state.cam=!state.cam;render()">${state.cam?'Camera off':'Camera on'}</button></div><div class="note" style="text-align:center">*Simulated media · no device access</div><button style="width:100%;margin-top:18px" onclick="state.help=true;notify('Help request added to the facilitator queue');render()">${state.help?'✓ Help requested':'Raise a help request'}</button></div><div class="card" style="margin-top:18px"><h3>What happens next</h3><p class="note">${state.step<5?steps[state.step+1].name:'Take your reflections into practice.'}</p><p class="note">Your facilitator starts the next step. You can focus on the work.</p></div></aside></div></div>`}
function evidenceCards(publishedOnly=false){return ev.map((e,i)=>publishedOnly&&!state.pins.includes(i)?'':`<article class="evidence"><div class="row between"><span class="eyebrow">${e.tag}</span>${!publishedOnly?`<button class="small ${state.pins.includes(i)?'primary':''}" onclick="togglePin(${i})">${state.pins.includes(i)?'✓ Selected':'Select for debrief'}</button>`:''}</div><h2 class="evidence-title">${e.title}</h2><div class="compare"><div><span class="eyebrow">${i===0?'FIRST ATTEMPT':'INITIAL POSITION'}</span><p>${e.before}</p></div><div><span class="eyebrow">${i===0?'REVISED ATTEMPT':'COUNTERPOINT / FEEDBACK'}</span><p>${e.after}</p></div></div><div style="border-top:1px solid var(--line);padding-top:12px;margin-top:15px"><strong style="font-size:12px">Discuss:</strong> <span class="note">${e.question}</span></div><button class="source-link" onclick="sourceModal(${i})">View source versions ↗</button></article>`).join('')}
function review(){return title('WORKSHOP RECORD','Make the learning visible.','Source-linked work, feedback, and revisions. Curated by you.',`<button onclick="downloadRecord()">Export record ↓</button><button class="primary" onclick="publishModal()">${state.published?'Published summary ✓':'Publish summary'}</button>`)+`<div class="stats"><div class="stat"><strong>18 / 20</strong><span class="note">Individual transfer responses</span></div><div class="stat"><strong>4 / 4</strong><span class="note">Groups revised their assessment</span></div><div class="stat"><strong>${state.pins.length}</strong><span class="note">Evidence items selected for debrief</span></div></div><div class="row cardhead"><button class="${state.reviewTab!=='individual'?'primary':''}" onclick="state.reviewTab='debrief';render()">Debrief board</button><button class="${state.reviewTab==='individual'?'primary':''}" onclick="state.reviewTab='individual';render()">Individual evidence</button></div>${state.reviewTab==='individual'?`<div class="card"><div class="row between cardhead"><h2>Individual evidence</h2>${pill('Trainer view · private')}</div><p class="note" style="margin-bottom:16px">Group output is kept separate from each participant’s evidence. These are sample records, not learning scores.</p><table><thead><tr><th>Participant</th><th>Initial response</th><th>Transfer</th><th>Evidence</th></tr></thead><tbody>${['Amina Mensah','Thabo Khumalo','Lina Njeri','Joseph Otieno','Nadia Khan'].map((x,i)=>`<tr><td>${x}</td><td>Submitted</td><td>${i===4?'Missing':'Submitted'}</td><td><button class="small" onclick="individualModal(${i})">View</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="layout"><section>${evidenceCards()}</section><aside><div class="card"><div class="eyebrow">FACILITATOR GUIDE</div><h2 style="font:400 23px Georgia,serif;margin:12px 0">Debrief the reasoning.</h2><p class="note">Select evidence that makes the learning objective discussable.</p><div class="step"><span class="stepnum">1</span><div>What did you assume?</div></div><div class="step"><span class="stepnum">2</span><div>Which evidence challenged it?</div></div><div class="step"><span class="stepnum">3</span><div>What will you do differently?</div></div><p class="note">Private individual responses are excluded from the publishable summary.</p><button style="width:100%;margin-top:17px" onclick="state.step=5;state.venue='breakouts';state.role='participant';render()">Preview participant debrief</button></div></aside></div>`}`}

function venueNav(){return `<div class="venuebar"><div class="room-tabs" aria-label="Meeting spaces"><button class="${state.venue==='main'?'on':''}" onclick="setVenue('main')">◫ Main room</button><button class="${state.venue==='breakouts'?'on':''}" onclick="setVenue('breakouts')">▦ ${state.role==='participant'?'My breakout':'Breakout console'}</button></div>${state.role==='facilitator'?`<button class="small" onclick="resourceManager(state.step)">Distribute resources ↗</button>`:`<button class="small" onclick="showMyResources()">My resources · ${availableResources().length}</button>`}</div>`}
function showMyResources(){state.venue='breakouts';state.partTab='resources';render()}
function setVenue(v){stopMedia(false);state.venue=v;render()}
function mainRoom(){const trainer=state.role==='facilitator';return title('MAIN ROOM · PLENARY','Reading the financing story',`${state.breakoutsOpen?'Breakouts open · facilitator in main room':'Everyone together · 20 participants'} · ${trainer?'You are facilitating':'You are a participant'}`,trainer?`<button class="primary" onclick="state.breakoutsOpen?setVenue('breakouts'):openBreakoutsModal()">${state.breakoutsOpen?'Manage breakouts':'Open breakout activity'}</button>`:pill('Main room'))+`<div class="layout"><section><div class="stage"><div class="stage-label"><span>▣ ${state.sharing?'Sethu is presenting':'Workshop presentation'}</span><span>Sample presentation · 1 / 3</span></div><div class="slide"><div class="eyebrow">${esc(steps[state.step].name)}</div><h2>What does a financing headline actually tell us?</h2><p>Separate the reported facts from the interpretation. Identify the evidence you would need before drawing a conclusion.</p><div class="row" style="margin-top:23px"><span class="pill">Evidence</span><span class="pill">Uncertainty</span><span class="pill">Judgment</span></div></div><div class="stage-label"><span>Sethu Nguna · facilitator</span><span>No recording · simulated media</span></div></div><div class="filmstrip">${['Sethu · you','Amina','Thabo','Lina','Joseph'].map((n,i)=>`<div class="video ${i===0?'host':''}"><span class="avatar">${['SN','AM','TK','LN','JO'][i]}</span><small>${n} · ${i===0&&state.mic?'mic on*':'muted'}</small></div>`).join('')}</div><div class="meeting-controls"><button class="${state.mic?'enabled':''}" onclick="state.mic=!state.mic;render()">${state.mic?'Mute microphone':'Unmute microphone'}</button><button class="${state.cam?'enabled':''}" onclick="state.cam=!state.cam;render()">${state.cam?'Camera off':'Camera on'}</button>${trainer?`<button class="${state.sharing?'enabled':''}" onclick="state.sharing=!state.sharing;render();notify('Presentation sharing '+(state.sharing?'started':'stopped')+' · simulated')">${state.sharing?'Stop sharing':'Present'}</button>`:`<button onclick="state.hand=!state.hand;render();notify(state.hand?'Hand raised in main room':'Hand lowered')">${state.hand?'Lower hand':'Raise hand'}</button>`}<button onclick="participantList()">Participants · 20</button></div><div class="note" style="text-align:center">Microphone, camera, and presentation controls are simulated. No devices are accessed.</div>${state.breakoutsOpen?`<div class="card main-tips"><div class="row between"><div><h3>Four breakouts are running</h3><p class="note">Monitor groups or bring everyone back for plenary.</p></div><button onclick="setVenue('breakouts')">${trainer?'View breakout console':'Go to my breakout'}</button></div>${trainer?`<button class="small" style="margin-top:12px" onclick="returnToMain()">Bring everyone back</button>`:''}</div>`:''}</section><aside><div class="card" style="margin-bottom:18px"><div class="row between"><h3>Room conversation</h3><span class="pill">Main room</span></div><div class="chat-message"><strong>Sethu · facilitator</strong><p>Welcome. Before we break into groups, take a moment to distinguish the claim from the evidence.</p></div><div class="chat-message"><strong>Amina</strong><p>Will we compare our first interpretation with the group's assessment?</p></div><div class="chat-message"><strong>Sethu · facilitator</strong><p>Yes — your individual answer stays separate, and we'll revisit the reasoning in our debrief.</p></div>${(state.mainChat||[]).map(t=>`<div class="chat-message"><strong>You</strong><p>${esc(t)}</p></div>`).join('')}<div class="field" style="margin:16px 0 8px"><label for="mainMsg">Message the main room</label><input id="mainMsg" placeholder="Add a thought or question…" onkeydown="if(event.key==='Enter')sendMainChat()"></div><button class="small" onclick="sendMainChat()">Send</button></div><div class="card"><div class="eyebrow">CURRENT LEARNING STEP</div><h2 style="font:400 22px Georgia,serif;margin:10px 0">${esc(steps[state.step].name)}</h2><p class="note">${steps[state.step].output}</p><p class="note">${trainer?'Open breakouts when participants are ready. The activity brings their instructions and work with them.':'Your trainer will start the breakout activity. Your instructions and task will appear in the same workspace.'}</p>${trainer?`<button style="margin-top:15px;width:100%" onclick="showTransition()">Preview next step</button>`:''}</div></aside></div>`}

{id:1,title:'How to assess a financing claim',type:'BRIEF',scope:'shared',group:0,role:'participant',activity:0,release:'auto',content:'CASE BRIEF · FICTIONAL TRAINING DATA\n\nA headline reports that a $450 million transport loan puts a country at risk of a debt crisis.\n\nYour job: distinguish reported facts from inferences. Identify missing evidence and assess the strength of the conclusion.\n\nAvailable information\n• Commitment: $450 million\n• Sector: transport infrastructure\n• Repayment schedule: not supplied\n• Revenue forecast: not verified\n\nRequired output: interpretation, evidence, uncertainty, and a defensible rationale.'},

function managerRender(){let list=resources.filter(r=>(state.resourceFilter===null||r.activity===state.resourceFilter)&&(state.resourceGroupFilter===null||r.scope==='shared'||r.scope==='group'&&r.group===state.resourceGroupFilter||r.scope==='role'));modal(`<div class="eyebrow">BUILD · RESOURCE ASSIGNMENTS</div><h2 style="margin-top:9px">Give each group the right materials.</h2><p>Resources follow activity assignments, not video-room membership. Automatic resources appear at their assigned step; manual resources wait for your release.</p><div class="assignment-grid"><div class="field"><label for="resourceStepFilter">Activity</label><select id="resourceStepFilter" onchange="state.resourceFilter=this.value==='all'?null:Number(this.value);managerRender()"><option value="all">All activities</option>${steps.map((x,i)=>`<option value="${i}" ${state.resourceFilter===i?'selected':''}>${i+1}. ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label for="resourceGroupFilter">Preview recipients</label><select id="resourceGroupFilter" onchange="state.resourceGroupFilter=this.value==='all'?null:Number(this.value);managerRender()"><option value="all">All groups</option>${rooms.map((r,i)=>`<option value="${i}" ${state.resourceGroupFilter===i?'selected':''}>${r.name}</option>`).join('')}</select></div></div><div class="row between" style="margin-bottom:15px"><span class="note">${list.length} assignments · current live step ${state.step+1}</span><button class="primary small" onclick="editResource()">+ Add resource</button></div><div class="list">${list.map(r=>resourceCard(r,true)).join('')||'<div class="card">No resources assigned to this selection.</div>'}</div><footer><button onclick="previewResources()">Preview participant resources</button><button class="primary" onclick="closeModal();render()">Done</button></footer><p class="note" style="margin-top:14px">Local mockup: assignments and uploaded files last until refresh. Access rules illustrate the intended behavior; this is not a secure delivery system.</p>`)}
function editResource(id){let r=resources.find(x=>x.id===id)||{title:'',scope:'shared',group:state.resourceGroupFilter||0,role:'observer',activity:state.resourceFilter??state.edit??state.step,release:'auto',content:'',type:'BRIEF'};state.editResourceId=id||null;state.resourceFile=null;modal(`<div class="eyebrow">RESOURCE + DELIVERY RULES</div><h2 style="margin-top:8px">${id?'Edit resource assignment':'Add a resource'}</h2><p>Attach a brief, a web link, or a local file, then choose who receives it and when.</p><div class="field"><label for="resTitle">Resource title</label><input id="resTitle" value="${esc(r.title)}"></div><div class="assignment-grid"><div class="field"><label for="resScope">Audience</label><select id="resScope">${['shared','group','role'].map(x=>`<option value="${x}" ${r.scope===x?'selected':''}>${{shared:'All groups',group:'Specific group',role:'Specific role'}[x]}</option>`).join('')}</select></div><div class="field"><label for="resGroup">Group (when group-specific)</label><select id="resGroup">${rooms.map((x,i)=>`<option value="${i}" ${r.group===i?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="field"><label for="resRole">Role (when role-specific)</label><select id="resRole">${['participant','observer','recorder','reporter'].map(x=>`<option ${r.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="resActivity">Available from activity</label><select id="resActivity">${steps.map((x,i)=>`<option value="${i}" ${r.activity===i?'selected':''}>${i+1}. ${esc(x.name)}</option>`).join('')}</select></div></div><div class="field"><label for="resRelease">Release rule</label><select id="resRelease"><option value="auto" ${r.release==='auto'?'selected':''}>Automatically at this activity</option><option value="manual" ${r.release==='manual'?'selected':''}>Only when facilitator releases</option></select></div><div class="field"><label for="resContent">Resource text or notes</label><textarea id="resContent">${esc(r.content||'')}</textarea></div><div class="field"><label for="resUrl">Optional resource link (https://)</label><input id="resUrl" type="url" placeholder="https://…" value="${esc(r.url||'')}"></div><div class="field"><label for="resFile">Optional file · stays in this tab</label><input id="resFile" type="file" onchange="state.resourceFile=this.files[0]||null"><span class="note">${r.file?'Existing file: '+esc(r.file.name):'PDF, spreadsheet, image, or document. Participant can download the attached file.'}</span></div><footer><button onclick="managerRender()">Cancel</button><button class="primary" onclick="saveResource()">Save assignment</button></footer>`)}
function saveResource(){let title=document.getElementById('resTitle').value.trim(),content=document.getElementById('resContent').value.trim(),url=document.getElementById('resUrl').value.trim(),old=resources.find(x=>x.id===state.editResourceId);if(!title||!content&&!url&&!state.resourceFile&&!old?.file){notify('Add a title and resource text, link, or file');return}if(url){try{if(new URL(url).protocol!=='https:')throw Error()}catch{notify('Use a valid HTTPS resource link');return}}let r={id:old?.id||Date.now(),title,content,url,scope:document.getElementById('resScope').value,group:Number(document.getElementById('resGroup').value),role:document.getElementById('resRole').value,activity:Number(document.getElementById('resActivity').value),release:document.getElementById('resRelease').value,type:state.resourceFile?'FILE':url?'LINK':old?.type||'BRIEF',file:state.resourceFile||old?.file,released:false};if(old)Object.assign(old,r);else resources.push(r);state.resourceFile=null;managerRender();notify('Assignment saved · appears for matching recipients at release')}

function resourceTabs(){return `<div class="resource-tabs"><button class="${state.partTab!=='resources'?'active':''}" onclick="state.partTab='task';render()">Current task</button><button class="${state.partTab==='resources'?'active':''}" onclick="state.partTab='resources';render()">Resources · ${availableResources().length}</button></div>`}

hange of video room alone does not grant access to another group’s case pack.</p><div class="step"><span>1</span><div>Open the case brief and your assigned material.</div></div><div class="step"><span>2</span><div>Return to Current task to record your assessment.</div></div><div class="step"><span>3</span><div>New evidence appears here when your trainer releases it.</div></div><button style="width:100%;margin-top:15px" onclick="state.partTab='task';render()">Back to current task</button></div></aside></div>`}

function media(i,mode){if(scanTimer){clearInterval(scanTimer);scanTimer=null}state.room=i;state.mode=mode;render();notify(`${mode} mode · ${rooms[i].name} · simulated, no microphone or audio connection`)}function stopMedia(redraw=true){if(scanTimer)clearInterval(scanTimer);scanTimer=null;state.room=null;state.mode='';if(redraw)render()}function scan(){stopMedia(false);state.room=0;state.mode='Scan';render();notify('Scanning demo · switches rooms every 5 seconds');scanTimer=setInterval(()=>{state.room=(state.room+1)%4;render()},5000)}
function modal(body){if(!document.querySelector('.modal'))window.modalReturn=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modal-back"><section role="dialog" aria-modal="true" class="modal">${body}</section></div>`;let d=document.querySelector('.modal'),h=d.querySelector('h2');if(h){h.id='modal-title';d.setAttribute('aria-labelledby','modal-title')}else d.setAttribute('aria-label','Dialog');let f=d.querySelector('input:not([type=file]),textarea,select')||d.querySelector('button');if(f)f.focus()}function closeModal(){document.getElementById('overlay').innerHTML='';let r=window.modalReturn;window.modalReturn=null;if(r&&r.isConnected&&r!==document.body)r.focus();else{let t=document.querySelector('#app h1');if(t){t.tabIndex=-1;t.focus()}}}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){let a=[...document.querySelectorAll('.modal button,.modal input,.modal textarea,.modal select')],first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.getElementById('overlay').onclick=e=>{if(e.target.classList.contains('modal-back'))closeModal()};
function showTransition(){if(state.step===5){modal(`<h2>Close this workshop?</h2><p>Live room access ends. Submitted work, feedback, and revisions remain in the workshop record.</p><footer><button onclick="closeModal()">Keep running</button><button class="primary" onclick="closeModal();state.view='review';stopMedia(false);render();notify('Demo workshop closed · review your sample record')">Close and review</button></footer>`);return}let n=steps[state.step+1];modal(`<div class="eyebrow">PREVIEW TRANSITION · STEP ${state.step+2}</div><h2 style="margin-top:10px">${n.name}</h2><p>You control when the next step starts. Current work remains preserved.</p><div class="card"><div class="step"><span>↳</span><div><strong>Instructions & tools</strong><p>${n.tool} · ${n.output}</p></div></div><div class="step"><span>↳</span><div><strong>${state.step===1?'Move work, keep people':'Update participant workspace'}</strong><p>${state.step===1?'Acacia → Cedar · Cedar → Ebony · Ebony → Baobab · Baobab → Acacia. Read-only submitted snapshots; no self-review.':n.scope}</p></div></div><div class="step"><span>!</span><div><strong>Demo prerequisite check</strong><p>${state.step===1?'Two groups have partial outputs. Confirming accepts partial inputs for this demonstration.':'Sample input references are available.'}</p></div></div></div><footer><button onclick="closeModal()">Cancel</button><button class="primary" onclick="advance()">${state.step===1?'Accept partial & start critique':'Start next step'}</button></footer>`)}

function lobby(){const host=facilitator(),sim=isSim(),me=host?'SN':'ZD',here=host?['AM','TK','LN','JO','NK']:['SN','TK','LN','JO','NK'],wait=waitingList().length,knock=(ui.knock||{})[ui.mode],dev=ui.dev||(ui.dev={mic:0,cam:0,spk:0}),opts={mic:['System default','Headset microphone','USB microphone'],cam:['Built-in camera','External camera'],spk:['System default','Headphones']},labels={mic:'Microphone',cam:'Camera',spk:'Speaker'},icn={mic:'mic',cam:'camera',spk:'speaker'},hostName=sim?'White Cell':'Sethu';return `<div class="lobby"><section class="lobby-preview" aria-label="Your preview"><div class="lobby-video ${state.cam?'cam-on':''}"><span class="person-initials">${me}</span><span class="lobby-you">You</span><span class="lobby-mic ${state.mic?'live':''}" role="img" aria-label="${state.mic?'Microphone on':'Microphone off'}">${state.mic?'<i></i><i></i><i></i>':icon('micoff')}</span></div><div class="device-dock lobby-controls"><button class="dock-button ${!state.mic?'pressed':''}" aria-label="${state.mic?'Mute microphone':'Unmute microphone'}" onclick="state.mic=!state.mic;render()">${icon(state.mic?'mic':'micoff')}</button><button class="dock-button ${!state.cam?'pressed':''}" aria-label="${state.cam?'Turn camera off':'Turn camera on'}" onclick="state.cam=!state.cam;render()">${icon('camera')}</button></div></section><section class="lobby-join"><h1 class="lobby-title">${workshopTitle()}</h1><div class="lobby-present"><span class="avatars">${here.map(p=>`<span class="avatar tiny-avatar">${p}</span>`).join('')}</span><span>${host?(wait?`${wait} waiting to join`:`No one waiting yet`):`${hostName} and 12 others are here`}</span></div><div class="lobby-devices">${['mic','cam','spk'].map(k=>`<div class="lobby-device">${icon(icn[k])}<select aria-label="${labels[k]}" onchange="ui.dev.${k}=this.selectedIndex">${opts[k].map((o,i)=>`<option ${dev[k]===i?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}</div>${host?`<button class="primary lobby-join-btn" oncli function presentationContent(){if(isSim())return `<div><div class="eyebrow">DEBRIO SCENARIO SERIES · 01</div><div class="sim-phase">${phases.map((p,i)=>`<span class="${i===ui.simPhase?'on':''}">${p}</span>`).join('')}</div><h2>${currentVenue()==='main'?'A deadline. Four perspectives. One financing decision.':esc(briefs[ui.simTeam].role)}</h2><p>${currentVenue()==='main'?'Kavala faces a $750m Eurobond maturity in six weeks. Creditor assurances remain incomplete. What can your team credibly commit to?':esc(briefs[ui.simTeam].mission)}</p><div class="situation-card"><div><strong>$750m</strong><small>MATURITY DUE</small></div><div><strong>6 weeks</strong><small>SCENARIO CLOCK</small></div><div><strong>4 teams</strong><small>DECISION ACTORS</small></div></div></div><div class="slide-footer"><span>Fictional training scenario · not live financial advice</span><span>KAVALA / T${ui.simTurn}</span></div>`;let step=steps[state.step];return `<div><div class="eyebrow">${esc(step.name)}</div><h2>${currentVenue()==='main'?'What does a financing headline actually tell us?':esc(step.task)}</h2><p>${currentVenue()==='main'?'Separate the reported facts from the interpretation. Identify the evidence you would need before drawing a conclusion.':esc(step.output)+'. Your instructions and resources are in the activity panel.'}</p><dl class="slide-brief"><div><dt>Working format</dt><dd>${esc(step.scope)}</dd></div><div><dt>Expected output</dt><dd>${esc(step.output)}</dd></div></dl></div><div class="slide-footer"><span>${state.sharing?'Sethu is presenting':'Workshop presentation'}</span><span>Activity ${state.step+1} of ${steps.length}</span></div>`}

function activityPanel(){if(isSim()){let b=briefs[ui.simTeam];return `<div class="row between" style="margin-bottom:14px"><span class="sim-teamtag">${teamNames[ui.simTeam]}</span><button class="quiet small" onclick="roomPicker()">Change preview</button></div><div class="card"><span class="mini-label">TEAM MANDATE</span><h3 style="font-size:16px;margin:9px 0">${esc(b.role)}</h3><p class="note">${esc(b.mission)}</p></div><div class="source-panel"><span class="mini-label">PRIVATE ROLE BRIEF · DEMO</span><p>${esc(b.private)}</p></div><p class="form-help">Role information is scoped to your assigned team in this preview. Real access control requires the production backend.</p><button class="primary btnblock" onclick="proposalForm()">Submit a proposed action</button><button class="btnblock" onclick="askRfi()">Request for information</button>${ui.proposals.filter(p=>p.team===ui.simTeam).map(p=>`<div class="card" style="margin-top:13px"><span class="mini-label">YOUR PROPOSED ACTION · ${esc(p.status)}</span><p style="font-size:12px">${esc(p.title)}</p></div>`).join('')}`};const s=steps[state.step],host=facilitator();return `<div class="act-timer"><span class="act-clock" id="clock">${clock()}</span>${host?`<div class="act-timer-controls"><button class="room-icon ${state.paused?'on':''}" aria-label="${state.paused?'Resume timer':'Pause timer'}" onclick="state.paused=!state.paused;render()">${icon(state.paused?'play':'pause')}</button><button class="room-icon" aria-label="Add 2 minutes" onclick="state.seconds+=120;render()">${icon('plus')}</button></div>`:''}</div><h3 class="act-title">${esc(s.name)}</h3><p class="act-task">${esc(s.task)}</p><div class="act-output" role="group" aria-label="Required output">${icon('output')}<span>${esc(s.output)}</span></div>${host?`<div class="act-actions"><button class="primary" onclick="showTransition()">${state.step===5?'Close workshop':'Next step'}${icon('arrow')}</button><button aria-label="${state.breakoutsOpen?'Manage groups':'Open breakouts'}" onclick="openBreakoutsModal()">${icon('rooms')}${state.breakoutsOpen?'Groups':'Breakouts'}</button></div><ol class="act-steps">${steps.map((x,i)=>`<li class="${i<state.step?'done':i===state.step?'current':''}"><span class="act-dot">${i<state.step?icon('check'):i+1}</span><span class="act-step-name">${esc(x.name)}</span><span class="act-step-time">${x.time} min</span></li>`).join('')}</ol>`:`<div class="act-actions"><button class="primary" onclick="taskModal()">Open workspace</button><button aria-label="Ask a question" onclick="askRfi()">${icon('hand')}Ask</button></div>`}`}
